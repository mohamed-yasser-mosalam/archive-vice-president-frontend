<app-navbar></app-navbar>
<div class="row" >
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" #exportForm="ngForm" (ngSubmit)="AddExportFile(exportForm.value)">

    <div class="wrapper">
      <legend class="text-center">ادخال الصادر</legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container">
          <div class="input-data">
            <input type="text" required  id="receiver" name="receiver" ngModel>
            <div class="underLine"></div>
            <label for="receiver">الجهة الصادر اليها الخطاب</label>
          </div>

          <div class="input-data">
            <input  cols="40" rows="1" required id="summary" name="summary" ngModel>
            <div class="underLine"></div>
            <label for="summary">ملخص الخطاب</label>
          </div>

          <div class="input-data">
            <input type="date" required  id="date" name="date" ngModel>
            <div class="underLine"></div>
            <label for="date">تاريخ الخطاب الصادر</label>
          </div>

          <button type="submit"  class="btn "
                  style="width:100px; padding:1px;color: white;background: #333333;font-size:22px;margin-right:10%">    حفظ
          </button>
        </div>


        <div class="input-container">

          <div class="input-data" readonly  >
            <input type="number" readonly required  id="no" name="no" >
            <label for="no" style="margin-right: 85%;color: black;margin-bottom:-5px" readonly>{{numberOfExportFile}}</label>

            <div class="underLine"></div>
            <label for="no" style="color: black">رقم القيد
               </label>
          </div>

          <div class="input-data">
            <input type="text" required  id="recipientName"name="recipientName" ngModel>
            <div class="underLine"></div>
            <label for="recipientName">المستلم</label>
          </div>

          <div class="input-data">
            <input type="number" required id="num" name="num"ngModel>
            <div class="underLine"></div>
            <label for="num">رقم الملف</label>
          </div>

          <div class="input-data">
            <input type="number" required  id="numberOfAttachments" name="numberOfAttachments" ngModel>
            <div class="underLine"></div>
            <label for="numberOfAttachments">عدد المرفقات</label>
          </div>

        </div>
      </div>

      </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
