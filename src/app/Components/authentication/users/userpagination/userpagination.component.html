<div class="page page-narrow">
  <div class="profile-layout">
  <form class="form-card" [formGroup]="showAllUsers">
    <legend>بيانات المستخدم</legend>
      <div class="form-row">
        <div class="input-data">
          <label>الاسم الأول</label>
          <input type="text" readonly formControlName="firstName">
        </div>
        <div class="input-data">
          <label>الاسم الثاني</label>
          <input type="text" readonly formControlName="lastName">
        </div>
      </div>
      <div class="form-row">
        <div class="input-data">
          <label>اسم المستخدم</label>
          <input type="text" readonly formControlName="username">
        </div>
        <div class="input-data">
          <label>رقم الموبايل</label>
          <input type="text" readonly formControlName="phone">
        </div>
        <div class="input-data">
          <label>الصلاحية</label>
          <input type="text" readonly formControlName="roles">
        </div>
      </div>
    <div class="form-actions">
      <ng-container *ngIf="isActive==1;else notactive">
        <button class="btn btn-danger" (click)="unActivateUser(username)" type="button" *ngIf="user.roles!='admin'">إلغاء التفعيل</button>
      </ng-container>
      <ng-template #notactive>
        <button class="btn btn-success" (click)="activatedUser(username)" type="button">تفعيل</button>
      </ng-template>
      <button *ngIf="username!='admin'" class="btn btn-outline-secondary" type="button" routerLink="/change-password-by-admin/{{page}}">تغيير الرقم السري</button>
      <div class="detail-pager">
        <ngb-pagination [(page)]="page" [pageSize]="size" [collectionSize]="pageLength"
                        (pageChange)="change($event)"
                        [maxSize]="1" [boundaryLinks]="true" [ellipses]="false" [rotate]="false"
                        routerLink="/user-pagination?page=/{{page}}">
        </ngb-pagination>
      </div>
    </div>
  </form>
  <aside class="profile-card">
    <img class="profile-avatar" [src]="img" alt="">
    <div class="profile-name">{{ username }}</div>
    <span class="pill" [class.pill-success]="isActive==1" [class.pill-danger]="isActive!=1">{{ isActive==1 ? 'مفعل' : 'غير مفعل' }}</span>
  </aside>
  </div>
</div>
