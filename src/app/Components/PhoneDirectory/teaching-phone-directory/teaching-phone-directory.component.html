<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">دليل الاتصال بأعضاء هيئة التدريس</h1>
    </div>
    <div class="page-actions">
      <app-search (searchTextChange)=onSearchTextEntered($event)></app-search>
      <button type="submit" class="btn btn-primary"
              routerLink="/add-teaching-phone">
        اضافة
      </button>
    </div>
  </div>

  <div class="table-card">
    <table class="data-table">
      <thead>
      <tr>
        <th>القيد</th>
        <th>الأسم</th>
        <th>الوظيفة</th>
        <th>القسم</th>
        <th>الموبايل</th>
        <th>موبايل الطوارئ</th>
        <th>العنوان</th>
        <th>الايميل</th>
        <th>الملاحظات</th>
        <th></th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of teachingPhoneDirectory| search:searchText" class="p-4 ">
        <td>{{ item.serial }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.job }}</td>
        <td>{{ item.department }}</td>
        <td>{{ item.phone }}</td>
        <td>{{ item.mobile }}</td>
        <td>{{ item.address }}</td>
        <td ><a href="mailto:{{ item.email }}">{{ item.email }}</a></td>
        <td>{{ item.notes }}</td>
        <td>
          <button type="button" class="row-action" title="تعديل" routerLink="/update-teaching-phone/{{item.id}}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </td>
        <td>
          <button type="button" class="row-action row-action-danger" title="حذف" (click)="deletePhone(item.id)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </td>

      </tr>
      </tbody>
    </table>
    <div class="empty-state" *ngIf="!teachingPhoneDirectory || !teachingPhoneDirectory.length">لا توجد بيانات لعرضها</div>
  </div>
</div>
