<app-navbar></app-navbar>
<div class="row">
  <div class="d-flex justify-content-between">
  <div class="w-100" style="
  zoom: 71%;
  background-color: var(--bg);
  text-align: center;
  position: sticky;
  overflow: auto;
  height:900px;
  border-radius: 8px;
  width:100%">
    <div class="row">
      <div class="d-flex"
           style="
           font-size: 20px;
           padding: 10px 35%;
           background-color: var(--bg);
           color: var(--color);
           position: sticky;
           top: 0;
           font-weight: bold">
        <app-search (searchTextChange)=onsearchTextEntered($event)></app-search>
        <div class="input-data ">
          <h2 style="margin-left: 20px">ملفات الارشيف </h2>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th> الاسم</th>
            <th>رقم الملف</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
           <tr *ngFor="let item of AllFiles | search:searchText" class="p-4 ">
             <td>{{ item.name }}</td>
            <td>{{ item.typeNumber }}/{{ item.num }}</td>
            <td *ngIf="item.id<=21;else first">
              <a routerLink="/archiveimport/{{item.id}}">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                  class="bi bi-box-arrow-left" viewBox="0 0 16 16" style="color:var(--color)">
                  <path fill-rule="evenodd"
                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                  <path fill-rule="evenodd"
                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
              </a>
            </td>
            <ng-template #first>
              <a *ngIf="item.id>21 && item.id<43 ; else second" routerLink="/archiveexport/{{item.id}}">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                  class="bi bi-box-arrow-left" viewBox="0 0 16 16" style="color:var(--color)">
                  <path fill-rule="evenodd"
                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                  <path fill-rule="evenodd"
                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
              </a>
            </ng-template>
            <ng-template #second>
              <a *ngIf="item.id >=43" routerLink="/archivespecial/{{item.id}}">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                  class="bi bi-box-arrow-left" viewBox="0 0 16 16" style="color:var(--color)">
                  <path fill-rule="evenodd"
                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                  <path fill-rule="evenodd"
                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
              </a>
            </ng-template>

          </tr>
          </tbody>
       </table>
    </div>
  </div>
  <div>
    <app-sidebar></app-sidebar>
  </div>
</div>
</div>
