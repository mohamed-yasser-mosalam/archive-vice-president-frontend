<aside class="sidebar">
  <a class="brand" routerLink="/home">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/>
      </svg>
    </span>
    <span class="brand-text">
      <span class="brand-name">الأرشيف الإلكتروني</span>
      <span class="brand-sub">نظام إدارة المراسلات</span>
    </span>
  </a>

  <nav class="nav-scroll">
    <div class="nav-section">الرئيسية</div>

    <a class="nav-link" routerLink="/home" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>لوحة التحكم</span>
    </a>

    <div class="nav-section">المراسلات</div>

    <a class="nav-link" [routerLink]="['/import-pagination']" [queryParams]="{page:1}"
       routerLinkActive="active" [routerLinkActiveOptions]="ignoreQuery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
      <span>الخطابات الواردة</span>
      <i class="dot dot-red"></i>
    </a>

    <a class="nav-link" [routerLink]="['/export-pagination']" [queryParams]="{page:1}"
       routerLinkActive="active" [routerLinkActiveOptions]="ignoreQuery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 21h16"/></svg>
      <span>الخطابات الصادرة</span>
      <i class="dot dot-green"></i>
    </a>

    <a class="nav-link" [routerLink]="['/special-pagination']" [queryParams]="{page:1}"
       routerLinkActive="active" [routerLinkActiveOptions]="ignoreQuery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span>ملفات الحفظ</span>
      <i class="dot dot-blue"></i>
    </a>

    <a class="nav-link" [routerLink]="['/dean-decision-pagination']" [queryParams]="{page:1}"
       routerLinkActive="active" [routerLinkActiveOptions]="ignoreQuery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
      <span>قرارات العميد</span>
    </a>

    <a class="nav-link" routerLink="/mandate-dashboard" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      <span>الإنتدابات</span>
    </a>

    <a class="nav-link" routerLink="/investigation" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>التحقيقات</span>
    </a>

    <a class="nav-link" routerLink="/all-files" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>ملفات الأرشيف</span>
    </a>

    <div class="nav-section">أدوات</div>

    <a class="nav-link" routerLink="/tools" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الأدوات</span>
    </a>
  </nav>

  <a class="logout" routerLink="/login">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m8 17-5-5 5-5"/><path d="M3 12h12"/></svg>
    <span>تسجيل الخروج</span>
  </a>
</aside>
