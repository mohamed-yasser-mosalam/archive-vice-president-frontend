<app-navbar></app-navbar>
<div class="row">
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" [formGroup]="formData" (ngSubmit)="AddSpecialFile(formData.value)">

    <div class="wrapper">
      <legend class="text-center">ادخال ملف خاص</legend>
      <div style="display: flex;  justify-content: space-between;">

        <div class="input-container">
          <div class="input-data">
            <input type="Date" required id="incomeDate" name="incomeDate" formControlName="incomeDate">
            <div class="underLine"></div>
            <label for="incomeDate">تاريخ الورود</label>
          </div>

          <div class="input-data">
            <input type="text" required id="sender" name="sender" formControlName="sender">
            <div class="underLine"></div>
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>
        </div>

        <div class="input-container">

          <div class="input-data">
            <input type="number" required id="num" name="num" formControlName="num">
            <div class="underLine"></div>
            <label for="num">رقم الملف</label>
          </div>


          <div class="input-data">
            <input type="text" required id="summary" name="summary" formControlName="summary">
            <div class="underLine"></div>
            <label for="summary">ملخص الخطاب</label>
          </div>
        </div>
      </div>
      <div formArrayName="subjects" style="overflow: scroll">
        <div *ngFor="let item of getSubject.controls;let i=index" [formGroupName]="i">
          <div class="subjects input-container" style="display:inline-flex;width: 100% ">
            <button type="button" class="btn" style="color: white;background-color: #333333;width:150px;height:30px;
                " (click)="removeSubject(i)"> حذف موضوع
            </button>
            <button type="button" class="btn" style="color: white;background-color: #333333;width:150px;height: 30px;" (click)="addSubjects()"> اضافة موضوع
            </button>


            <div class="input-data">
              <input type="text" required id="head" name="head" formControlName="head">
              <div class="underLine"></div>
              <label for="head"> اضافة موضوع </label>
            </div>
            <div class="input-data" style="margin-left: 20px">
              <input type="number" required name="num" formControlName="num">
              <div class="underLine"></div>
              <label for="num"> رقم موضوع </label>
            </div>
          </div>

          <div formArrayName="decision" style="overflow: scroll">
            <div *ngFor="let item of getDecision(i).controls;let j=index" [formGroupName]="j">
              <button type="button" class="btn" style="color: white;background-color: #333333;width:100px;height: 30px;"
                      (click)="addDecision(i)"> اضافة قرار
              </button>
              <button *ngIf="getDecision(i).length>1"
                type="button" class="btn" style="color: white;background-color: #333333;width:100px;height: 30px;"
                      (click)="deleteDecision(i,j)"> حذف القرار
              </button>
              <div class="subjects input-container" style="display:inline-flex;width: 100% ">

                <div class="input-data">
                  <input type="text" required name="summary" formControlName="summary">
                  <div class="underLine"></div>
                  <label for="summary"> موضوع القرار </label>
                </div>
                <div class="input-data" style="margin-left: 20px">
                  <input type="number" required name="num" formControlName="num">
                  <div class="underLine"></div>
                  <label for="num"> رقم القرار </label>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>


      {{ formData.value|json }}

    </div>

    <button type="submit" class="btn" style="color: white;background-color: #333333;width:150px;height:30px;"  >تأكيد الحفظ
    </button>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
