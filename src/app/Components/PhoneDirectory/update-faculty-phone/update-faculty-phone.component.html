<div class="page page-narrow">
  <form class="form-card"  [formGroup]="editFacultyPhone" (ngSubmit)="update()">
      <div class="wrapper ">
          <legend class="text-center">تعديل دليل تليفونات كلية الحاسبات والمعلومات</legend>


          <div class="d-flex">
            <div class="input-data">
              <input type="text" readonly formControlName="serial">
              <label>القيد</label>
            </div>

          </div>
          <div class="input-data">
            <input cols="40" rows="1"  required formControlName="side">
            <label>الجهة</label>


          </div>
          <div class="d-flex">
            <div class="input-data">
              <input type="text" required formControlName="phone">
              <label>الرقم</label>
            </div>
          </div>

            <button type="submit" class="btn btn-primary">حفظ</button>
      </div>
  </form>
</div>
