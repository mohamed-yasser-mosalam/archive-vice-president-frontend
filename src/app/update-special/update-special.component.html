<app-navbar></app-navbar>
<div class="row" style="background-color: var(--bg);">
  <div class="d-flex justify-content-between">
    
  <div class="d-flex w-100">
  <div style="width: 20%;"></div>
  <form style="width:71%;zoom: 80%" [formGroup]="form">
  <div class="wrapper">
    <legend class="text-center" style="color: var(--color);">تعديل ملف خاص</legend>
    <div style="display: flex;  justify-content: space-between;">

      <div class="input-container">

        <div class="input-data">
          <input type="text" required id="sender" name="sender"  >
          <div class="underLine"></div>
          <label for="sender">الجهة الوارد منها الخطاب</label>
        </div>
      </div>

      <div class="input-container">

        <div class="input-data">
          <input type="number" required id="num" name="num" [(ngModel)]="specialFile.num">
          <div class="underLine"></div>
          <label for="num">رقم الملف</label>
        </div>
      </div>
    </div>
    <div class="input-data"  >
      <input type="text" required id="summary" name="summary" [(ngModel)]="specialFile.summary">
      <div class="underLine"></div>
      <label for="summary" style="margin-right: 0!important;">ملخص الخطاب</label>
    </div>
    <div formArrayName="subjects" style="overflow: auto; background-color: var(--bg);">
      <div *ngFor="let subject of subjects.controls; let i = index" [formGroupName]="i">
        <div class="subjects  input-container" style="display:inline-flex;width: 100% ">

          <a (click)="deleteSubject(i)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16" style="color: red;margin-right: 10px">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"/>
            </svg>
          </a>

          <a (click)="addSubject()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16" style="color: green">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
            </svg>
          </a>

          <div class="input-data">
            <input type="text" required id="head" name="head" [(ngModel)]="specialFile.head">
            <div class="underLine"></div>
            <label for="head"> اضافة موضوع </label>
          </div>
          <div class="input-data" style="margin-left: 20px">
            <input type="number" required name="num" [(ngModel)]="specialFile.num">
            <div class="underLine"></div>
            <label for="num"> رقم موضوع </label>
          </div>
          <hr>
        </div>

        <div formArrayName="decision" style="overflow: auto">
          <div *ngFor="let decision of getDecisions(i).controls; let j = index" [formGroupName]="j">

            <a (click)="deleteDecision(i,j)" style="margin-left: 0">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                   class="bi bi-dash-circle" viewBox="0 0 16 16" style="color: red;margin-right: 10px">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"/>
              </svg>
            </a>

            <a (click)="addDecision(i)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                   class="bi bi-plus-circle" viewBox="0 0 16 16" style="color: blue">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path
                  d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
              </svg>
            </a>

            <div class="subjects input-container" style="display:inline-flex;width: 100% ">

              <div class="input-data">
                <input type="text" required name="summary" [(ngModel)]="specialFile.summary">
                <div class="underLine"></div>
                <label for="summary"> موضوع القرار </label>
              </div>
              <div class="input-data" style="margin-left: 20px">
                <input type="number" required name="num" [(ngModel)]="specialFile.num">
                <div class="underLine"></div>
                <label for="num"> رقم القرار </label>
              </div>
            </div>

          </div>
        </div>
      </div>

      {{form|json}}
    </div>

    <button type="submit" class="btn m-5" style="color: var(--color);background-color: var(--bg_hover);width:150px;height:30px;"  >تأكيد الحفظ
    </button>
  </div>
</form>
</div>

  <div>
    <app-sidebar></app-sidebar>
  </div>

  </div>
</div>
