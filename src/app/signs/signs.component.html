<div class="d-flex justify-content-between" style="background-color: var(--bg_main);">
  <div class="w-100">
    <form>
      <div class="wrapper">
        <legend class="text-center" style="font-weight: bolder;font-size: 25px;color:var(--color);">رقم الأشارة
          (1)</legend>
        <div style="margin:20px auto;font-size:20px">
          <span style="color: var(--color);">للعام الجامعي : 2023م\2024م</span>&nbsp;&nbsp;&nbsp;&nbsp;
          <span style="color: var(--color);margin-right: 20px;">بتاريخ :
                        12\3\2024م</span>&nbsp;&nbsp;&nbsp;&nbsp;
        </div>
        <div class="input-container ">
          <div class="input-data">
            <input type="text" required readonly>
            <label>الجهة الوارد منها الأشارة</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>عن طريق</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data">
            <input type="text" required readonly>
            <label>مبلغ الأشارة</label>
          </div>
          <div class="input-data" style="width:20%">
            <input type="text" required readonly>
            <label>الصفة </label>
          </div>
          <div class="input-data" style="width:20%">
            <input type="text" required readonly>
            <label>الموبايل </label>
          </div>
        </div>
        <div class="input-container">
          <div class="input-data w-100">
            <input readonly required id="summary" formControlName="summary">
            <label for="summary" style="margin-bottom: 20px">محتوي الأشارة</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>التوقيع(الأشارة)</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>الصفة</label>
          </div>
        </div>
        <div class="input-container ">
          <h2 style="text-decoration: underline;font-size:25px">مستلم الأشارة</h2>
          <h2 style="text-decoration: underline;font-size:25px">المختص بتنفيذ الأشارة</h2>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>الاسم</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>الاسم</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>الصفة</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>الصفة</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>التاريخ</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>التاريخ</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" required readonly>
            <label>يعتمد , عميد الكلية</label>
          </div>
          <mat-paginator [length]="100" [pageSize]="1"
                         style="background-color: var(--bg); color: var(--color);font-size: large;">
          </mat-paginator>
        </div>
      </div>
    </form>

  </div>
  <div>
    <app-sidebar></app-sidebar>
  </div>
</div>
