<app-navbar></app-navbar>

<div class="d-flex justify-content-between" style="background-color: var(--bg_main);height: 93vh;">
  <div class="w-100">
    <form [formGroup]="signForm">
      <div class="wrapper">
        <legend class="text-center" style="font-weight: bolder;font-size: 20px;color:var(--color);">رقم الأشارة
          {{ no }}
        </legend>
        <div class="input-container ">
          <div class="input-data">
            <input type="datetime-local" readonly id="date" name="date" formControlName="date">
            <label for="date">بتاريخ :  </label>
          </div>
          <div class="input-data">
            <input type="text" readonly id="universityYear" name="universityYear" formControlName="universityYear">
            <label for="universityYear">للعام الجامعي :</label>
          </div>
        </div>

        <div class="input-container ">
          <div class="input-data">
            <input type="text" readonly id="sender" name="sender" formControlName="sender">
            <label for="sender">الجهة الوارد منها الأشارة</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="via" name="sender" formControlName="via">
            <label for="via">عن طريق</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data">
            <input type="text" readonly id="signInformer" name="signInformer" formControlName="signInformer">
            <label for="signInformer">مبلغ الأشارة</label>
          </div>
          <div class="input-data" style="width:20%">
            <input type="text" readonly id="signInformerSelf" name="signInformerSelf"
                   formControlName="signInformerSelf">
            <label for="signInformerSelf">الصفة </label>
          </div>
          <div class="input-data" style="width:20%">
            <input type="text" readonly id="signInformerPhone" name="signInformerPhone"
                   formControlName="signInformerPhone">
            <label for="signInformerPhone">الموبايل </label>
          </div>
        </div>
        <div class="input-container">
          <div class="input-data" style="width:90%">
            <input readonly id="summary" formControlName="summary">
            <label for="summary">محتوي الأشارة</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signSignature" name="signSignature" formControlName="signSignature">
            <label for="signSignature">التوقيع(الأشارة)</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signSelf" name="signSelf" formControlName="signSelf">
            <label for="signSelf">الصفة</label>
          </div>
        </div>
        <div class="input-container ">
          <h2 style="text-decoration: underline;font-size:25px">مستلم الأشارة</h2>
          <h2 style="text-decoration: underline;font-size:25px">المختص بتنفيذ الأشارة</h2>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signRecipientName" name="signRecipientName"
                   formControlName="signRecipientName">
            <label for="signRecipientName">الاسم</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signExcutedName" name="signExcutedName" formControlName="signExcutedName">
            <label for="signExcutedName">الاسم</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signRecipientSelf" name="signRecipientSelf"
                   formControlName="signRecipientSelf">
            <label for="signRecipientSelf">الصفة</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signExcutedSelf" name="signExcutedSelf" formControlName="signExcutedSelf">
            <label>الصفة</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signRecipientDate" name="signRecipientDate"
                   formControlName="signRecipientDate">
            <label for="signRecipientDate">التاريخ</label>
          </div>
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="signExecutionDate" name="signExecutionDate"
                   formControlName="signExecutionDate">
            <label for="signExecutionDate">التاريخ</label>
          </div>
        </div>
        <div class="input-container ">
          <div class="input-data" style="width:30%">
            <input type="text" readonly id="depend" name="depend" formControlName="depend">
            <label for="depend">يعتمد , عميد الكلية</label>
          </div>
          <div class="input-data">
            <div class="d-flex justify-content-around">
              <div class="">


              </div>
              <div class="  pag" style="margin-right:30px;direction: ltr">
                <ngb-pagination [(page)]="page" [pageSize]="size" [collectionSize]="pageLength"
                                (pageChange)="change($event)"
                                [maxSize]="1" [boundaryLinks]="true" [ellipses]="false" [rotate]="false"
                                routerLink="/all-sign-pagination?page=/{{page}}">
                </ngb-pagination>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>

  </div>
  <div>
    <app-sidebar></app-sidebar>
  </div>
</div>
