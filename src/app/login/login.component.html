<div class="container ">
  <div class="d-flex justify-content-center h-50 myheight">
    <div class="card">
      <div class="card-header">
        <h3>Sign In</h3>
        <div class="d-flex justify-content-end social_icon">
          <span><i class="fab fa-facebook-square"></i></span>
          <span><i class="fab fa-google-plus-square"></i></span>
          <span><i class="fab fa-twitter-square"></i></span>
        </div>
      </div>
      <div class="card-body">
        <form (ngSubmit)="login()" [formGroup]="loginParentGroup" >
          <div formGroupName="user">
            <div class="input-group form-group">
              <input formControlName="username" type="text" class="form-control" placeholder="username">
            </div>
            <div class="input-group form-group mt-3">
              <input formControlName="password" type="password" class="form-control" placeholder="password">
            </div>
            <div class="form-group my-3 ml-2">
              <button type="submit" class="btn float-right login_btn">login</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
