<div class="login-page">
  <img class="corner-logo logo-right" src="assets/logo/Zagazig university.logo.png" alt="">
  <img class="corner-logo logo-left" src="assets/logo/fci.zu.jpeg" alt="">

  <div class="login-wrap">
    <form class="login-card" (ngSubmit)="login()" [formGroup]="loginParentGroup">
      <div class="login-head">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
        </span>
        <h1>برنامج الأرشيف الإلكتروني</h1>
        <p class="login-hint">سجل الدخول بحسابك للمتابعة</p>
      </div>

      <div formGroupName="user">
        <div class="input-data">
          <label for="username">اسم المستخدم</label>
          <input id="username" formControlName="username" type="text" placeholder="اسم المستخدم" autocomplete="username">
          <small *ngIf="loginParentGroup.get('username')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="password">الرقم السري</label>
          <input id="password" formControlName="password" type="password" placeholder="الرقم السري" autocomplete="current-password">
          <small *ngIf="loginParentGroup.get('password')?.invalid">* مطلوب</small>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">
          الدخول للبرنامج
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
        </button>
      </div>
    </form>

    <div class="brand-foot">كلية الحاسبات والمعلومات · جامعة الزقازيق</div>
  </div>
</div>
