<app-navbar></app-navbar>
<div class="row">
  <div class="col-2" style="background-color: var(--bg_main);"></div>
  <div class="col-9" style="background-color:var(--bg_main)">
    <form class="col-8" [formGroup]="facultyForm" (ngSubmit)="onSubmit()">

      <div class="wrapper " style="direction: ltr;">
        <legend class="text-center">ادخال الأرقام الداخلية للكلية</legend>

        <div class="d-flex">
          <div class="input-data" style="width:30%; margin-left:auto;">
            <input type="text" required id="serial" name="serial" formControlName="serial">
            <label for="serial">القيد</label>
            <small *ngIf="facultyForm.get('serial')?.invalid">* مطلوب</small>
          </div>

        </div>
        <div class="input-data" style="width:96%; margin-left: auto;">
          <input cols="40" rows="1"  required id="side" name="side" formControlName="side">
          <label for="side">الجهة</label>
          <small *ngIf="facultyForm.get('side')?.invalid">* مطلوب</small>

        </div>
        <div class="d-flex">

          <div class="input-data" style="width:45%; margin-left:auto;">
            <input type="text" id="phone" name="phone" formControlName="phone"  >
            <label for="phone">الرقم</label>
            <small *ngIf="facultyForm.get('phone')?.invalid">* مطلوب</small>
          </div>
        </div>

        <button type="submit" class="btn  " [disabled]="!facultyForm.valid"
                style="width:100px; padding:1px;color: var(--color);background: var(--bg_hover);font-size:22px;margin-right:10%"> حفظ
        </button>
      </div>
    </form>
  </div>
  <div class="col-1">
    <app-sidebar></app-sidebar>
  </div>
</div>
