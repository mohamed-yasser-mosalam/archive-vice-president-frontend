<app-navbar></app-navbar>
<div class="row">
  <div class="col-2"></div>
  <form class="col-6 " style="zoom: 80%;margin-top: 120px;margin-right:243px;margin-left: 41px" #studentForm="ngForm"
        (ngSubmit)="submitForm(studentForm)">
    <div class="wrapper scrollable-area m-0" >
      <div class="input-container " >

         <div  *ngFor="let student of studentData; let studentIndex = index; trackBy:track;">

           <div class="border border-dark scrollable-area m-0">
          <div class="input-container" style="display: flex; justify-content: space-between;">

            <div class="input-data">
            <input type="text" required id="decision" [(ngModel)]="student.name"
                   name="name_{{student.studentId}}" />
            <div class="underLine"></div>
            <label for="decision">القرار</label>
          </div>
            <div class="input-data" >
              <input id="decisionId" type="number" required class=”form-control” [(ngModel)]="student.age"
                     name="age_{{student.studentId}}"  />
              <div class="underLine"></div>
              <label for="decisionId" >رقم القرار </label>
            </div>
          </div>
          <button *ngIf="studentData.length > 1" type="button" class="btn btn-sm btn-danger"
                  (click)="removeStudent(studentIndex)"
                  style="height:30px;width: 120px;margin-top: 10px">ازالة القرار
          </button>
           <div *ngFor="let subject of student.subjects; let subjectIndex = index; trackBy:track;">

            <div class="input-container" style="display: flex; justify-content: space-between">

              <div class="input-data">
                <input id="subject" required type="text" name="marks_{{subject.subjectId}}" [(ngModel)]="subject.marks"/>
                <div class="underLine"></div>
                <label for="subject">الموضوع</label>
              </div>
              <div class="input-data">
                <input id="subjectId" required type="number" name="subject_{{subject.subjectId}}" [(ngModel)]="subject.subject"/>
                <div class="underLine"></div>
                <label for="subjectId">رقم الموضوع</label>
              </div>
            </div>


            <button *ngIf="student.subjects.length > 1" type="button" class="btn btn-sm btn-danger"
                    (click)="removeSubject(studentIndex, subjectIndex)"
                    style="height:30px;width: 120px;margin-left: 20px;margin-top: 10px">ازالة الموضوع
            </button>
           </div>

          </div>

          <!-- For Adding subject in student element -->
          <button type="button" class="btn btn-sm   mt-2" (click)="addNewSubject(studentIndex)"
          style="color: white;background: #333333;height:40px;width: 120px">اضافة موضوع جديد
          </button>
        </div>
      </div>
    </div>
    <!-- For adding new student -->
    <button type="button" class="btn btn-sm  mt-4" (click)="addNewStudent()"
            style="color: white;background: #333333;height:40px;width: 120px">اضافة قرار جديد</button>
    <button type="submit" class="btn btn-sm btn-success mt-4 ms-2" type="submit"
            [disabled]="studentForm.status == 'INVALID'"
            style="height:40px;width: 120px">تأكيد
    </button>

  </form>
   <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
