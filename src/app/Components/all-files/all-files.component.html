<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">ملفات الارشيف</h1>
    </div>
    <div class="page-actions">
      <app-search (searchTextChange)=onsearchTextEntered($event)></app-search>
      <button routerLink="/add-archive-file" class="btn btn-primary">اضافة
      </button>
      <button class="btn btn-danger" *ngIf="stateOfClose==true" (click)="closeArchive($event)">حذف
      </button>
    </div>
  </div>

  <div class="table-card">
    <table class="data-table">
      <thead>
      <tr>
        <th> الاسم</th>
        <th>رقم الملف</th>
        <th>عدد الخطابات</th>
        <th>تعديل</th>
        <th>حذف</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of AllFiles | search:searchText"  class="p-4 " >
        <td>{{ item.name }}</td>
        <td>{{ item.typeNumber }}/{{ item.num }}</td>
        <td>{{ item.count }}</td>

        <td>
          <button type="button" class="row-action" title="تعديل" routerLink="/update-archive-file/{{item.id}}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </td>
        <td>
          <button type="button" class="row-action row-action-danger" title="حذف" (click)="deleteArchiveFile(item.typeNumber , item.num)" *ngIf="item.canDelete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </td>

        <td>
      <a class="row-action" *ngIf="item.typeNumber==1" routerLink="/archive-import/{{item.id}}">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
        class="bi bi-box-arrow-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/>
        <path fill-rule="evenodd"
        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
        </svg>
      </a>
      <a class="row-action" *ngIf="item.typeNumber==2" routerLink="/archive-export/{{item.id}}">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
        class="bi bi-box-arrow-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/>
        <path fill-rule="evenodd"
        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
        </svg>
      </a>
      <a class="row-action" *ngIf="item.typeNumber==3" routerLink="/archive-special/{{item.id}}">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
        class="bi bi-box-arrow-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/>
        <path fill-rule="evenodd"
        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
        </svg>
      </a>
        </td>

      </tr>
      </tbody>
    </table>
    <div class="empty-state" *ngIf="!AllFiles || !AllFiles.length">لا توجد بيانات لعرضها</div>
  </div>
</div>
