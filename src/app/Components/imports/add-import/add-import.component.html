<div class="page page-narrow">
  <form class="form-card" [formGroup]="importForm" (ngSubmit)="onSubmit()">
    <div class="wrapper">
      <legend class="text-center">ادخال الوارد</legend>
      <div class="input-data">
        <input type="text" readonly id="no" name="no" [value]="numberOfImportFile ?? ''">
        <div class="underLine"></div>
        <label for="no">رقم القيد</label>
      </div>

      <div class="d-flex">
        <div class="input-data">
          <input type="text" required id="sender" name="sender" formControlName="sender">
          <div class="underLine"></div>
          <label for="sender">الجهه الوارد منها الخطاب</label>
          <small *ngIf="importForm.get('sender')?.invalid">* مطلوب</small>

        </div>

        <div class="input-data">
          <input type="number" required id="numberOfAttachments" name="numberOfAttachments"
                 formControlName="numberOfAttachments">
          <div class="underLine"></div>
          <label for="numberOfAttachments">عدد المرفقات</label>
          <small *ngIf="importForm.get('numberOfAttachments')?.invalid">* مطلوب</small>

        </div>
        <div class="input-data">
          <input type="date" required id="incomeDate" name="incomeDate" formControlName="incomeDate">
          <div class="underLine"></div>
          <label for="incomeDate">تاريخ الورود</label>
          <small *ngIf="importForm.get('incomeDate')?.invalid">* مطلوب</small>

        </div>
      </div>
      <div class="d-flex">
        <div class="input-data">
          <input type="date" id="incomingLetterDate" name="incomingLetterDate"
                 formControlName="incomingLetterDate">
          <div class="underLine"></div>
          <label for="incomingLetterDate">تاريخ الخطاب الوارد</label>
        </div>
        <div class="input-data">
          <input type="number" id="incomingLetterNumber" name="incomingLetterNumber"
                 formControlName="incomingLetterNumber">
          <div class="underLine"></div>
          <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
        </div>
      </div>
      <div class="input-data">
        <input cols="40" rows="1" required id="summary" name="summary" formControlName="summary">
        <div class="underLine"></div>
        <label for="summary">ملخص الخطاب</label>
        <small *ngIf="importForm.get('summary')?.invalid">* مطلوب</small>

      </div>
      <div class="d-flex">
        <div class="input-data">
          <input type="date" id="recipientDate" name="recipientDate" formControlName="recipientDate">
          <div class="underLine"></div>
          <label for="recipientDate">تاريخ الاستلام</label>
        </div>
        <div class="input-data">
          <input type="text" id="recipientName" name="recipientName" formControlName="recipientName">
          <div class="underLine"></div>
          <label for="recipientName">المستلم</label>
        </div>
      </div>
      <div class="d-flex">
        <div class="input-data">
          <label for="num">ملف الحفظ</label>
          <small *ngIf="importForm.get('num')?.invalid">* مطلوب</small>
          <select id="num" required name="num" formControlName="num">
            <option></option>
            <option *ngFor="let item of importArchive"
                    [selected]="item.num" [value]="item.num"
            >{{ item.name }} - {{ item.num }}
            </option>
          </select>
        </div>
        <div class="input-data">
          <input type="date" id="expectResponseDate" name="expectResponseDate"
                 formControlName="expectResponseDate">
          <div class="underLine"></div>
          <label for="expectResponseDate">التاريخ المتوقع للرد</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!importForm.valid"> حفظ
      </button>
    </div>
  </form>
</div>
