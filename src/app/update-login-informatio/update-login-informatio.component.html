<app-navbar></app-navbar>
<div class="row" style="background-color:var(--bg)">
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" [formGroup]="editUserName" (ngSubmit)="updateUserInformation()">

    <div class="wrapper">
      <legend class="text-center" style="color:var(--color)">تعديل بيانات مستخدم</legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container">
          <div class="input-data">
            <input cols="40" rows="1" required id="lastName" name="lastName" formControlName="lastName">
            <div class="underLine"></div>
            <label for="lastName"> الاسم الثاني</label>
          </div>
          <button type="submit" class="btn btn-success w-50"
            style="padding:10px;background: var(--bg_hover);color: var(--color);margin-left: 30%"> حفظ</button>



        </div>


        <div class="input-container">

          <div class="input-data">
            <input type="text" required id="firstName" name="firstName" formControlName="firstName">
            <div class="underLine"></div>
            <label for="firstName">الاسم الاول</label>
          </div>

          <div class="input-data">
            <input type="text" required id="username" name="username" formControlName="username">
            <div class="underLine"></div>
            <label for="username">اسم المستخدم</label>
          </div>

        </div>
      </div>
    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
