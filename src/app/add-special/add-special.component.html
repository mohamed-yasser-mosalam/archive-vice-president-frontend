<app-navbar></app-navbar>
<div class="row" >
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" #addImportForm="ngForm" (ngSubmit)="addImportFile(addImportForm.value)" >
    <div class="wrapper">
      <legend class="text-center">ادخال ملف خاص </legend>
      <div style="display: flex;  justify-content: space-between;">

        <div class="input-container">

          <div class="input-data">
            <input type="text" required  id="sender" name="sender" ngModel>
            <div class="underLine"></div>
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>


          <div class="input-data">
            <button type="submit" id="attachment"  class="btn w-100"  style="padding:10px;background: #333333;color: white">    حفظ  </button>
          </div>


          <!--          <div class="input-data">-->
<!--            <input id="AddingAttachment" type="file" name="img" accept="image/*" (change)="onImageSelected($event)"  >-->
<!--            <div class="underLine"></div>-->
<!--            <label for="AddingAttachment">اختيار مرفق</label>-->
<!--          </div>-->


        </div>

        <div class="input-container">


          <div class="input-data">
            <input type="text"  required id="summary" name="summary" ngModel>
            <div class="underLine"></div>
            <label for="summary">ملخص الخطاب</label>
          </div>





          <div class="input-data">
            <input type="number" required id="num" name="num"ngModel>
            <div class="underLine"></div>
            <label for="num">رقم الملف</label>
          </div>

        </div>
      </div>

    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
