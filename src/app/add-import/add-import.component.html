<app-navbar></app-navbar>
<div class="row">
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" #addImportForm="ngForm" (ngSubmit)="addImportFile(addImportForm.value)">
    <div class="wrapper">
      <legend class="text-center">ادخال الوارد</legend>
      <div style="display: flex;  justify-content: space-between;">

        <div class="input-container">


          <div class="input-data">
            <input type="text" required id="sender" name="sender" ngModel>
            <div class="underLine"></div>
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>


          <div class="input-data">
            <input type="number" required id="incomingLetterNumber" name="incomingLetterNumber" ngModel>
            <div class="underLine"></div>
            <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
          </div>


          <div class="input-data">
            <input type="date" required id="incomingLetterDate" name="incomingLetterDate" ngModel>
            <div class="underLine"></div>
            <label for="incomingLetterDate">تاريخ الخطاب الوارد</label>
          </div>

          <div class="input-data">
            <input type="date" required id="expectResponseDate" name="expectResponseDate" ngModel>
            <div class="underLine"></div>
            <label for="expectResponseDate">تاريخ المتوقع للرد </label>
          </div>

        </div>

        <div class="input-container">


          <div class="input-data">
            <input type="text" required id="summary" name="summary" ngModel>
            <div class="underLine"></div>
            <label for="summary">ملخص الخطاب</label>
          </div>


          <div class="input-data">
            <input type="text" required id="recipientName" name="recipientName" ngModel>
            <div class="underLine"></div>
            <label for="recipientName">المستلم</label>
          </div>

          <div class="input-data">
            <input type="date" required id="recipientDate" name="recipientDate" ngModel>
            <div class="underLine"></div>
            <label for="recipientDate">تاريخ الاستلام</label>
          </div>


          <div class="input-data">
            <input type="number" required id="num" name="num" ngModel>
            <div class="underLine"></div>
            <label for="num">رقم الملف</label>
          </div>


        </div>
      </div>
      <button type="submit" class="btn  "
              style="width:100px; padding:1px;color: white;background: #333333;font-size:22px;margin-right:10%"> حفظ
      </button>
    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
