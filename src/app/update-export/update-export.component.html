
<app-navbar xmlns="http://www.w3.org/1999/html"></app-navbar>
<div class="row" >
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
  <form class="col-8" style="zoom: 80%"  [formGroup]="editExport" (ngSubmit)="update()" >

    <div class="wrapper">
      <legend class="text-center">  {{x}} تعديل ملف الصادر رقم </legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container ">

          <div class="input-data">
            <input type="text" required  readonly  id="date" formControlName="date"  >
            <label for="date">تاريخ الصادر</label>
          </div>

          <div class="input-data">
            <input type="text" required  readonly  id="numberOfAttachments" numberOfAttachments="date"  >
            <label for="numberOfAttachments">عدد المرفقات</label>
          </div>

          <div class="input-data">
            <input type="text" required    id="receiver" formControlName="receiver"  >
            <label for="receiver">الجهة الصادر اليها الخطاب</label>
          </div>



        </div>

        <div class="input-container">

          <div class="input-data">
            <input  cols="40" rows="1"   required id="summary"  formControlName="summary" >
            <label for="summary">ملخص الخطاب</label>
          </div>


          <div class="input-data">
            <input type="text" required   id="recipientName"  formControlName="recipientName"  >
            <label for="recipientName">المستلم</label>
          </div>

          <div class="input-data">
            <input type="number" required  id="num" formControlName="num" >
            <label for="num">رقم الملف</label>
          </div>

          <button type="submit"  class="btn btn-success w-100"  style="padding:10px;"  routerLink="/updateexport/{{x}}" >    تعديل  </button>

        </div>


      </div>
    </div>
  </form>
</div>
