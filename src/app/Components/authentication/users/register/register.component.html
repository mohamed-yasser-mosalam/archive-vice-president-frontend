<div class="page page-narrow">
  <div class="profile-layout no-aside">
  <form class="form-card" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <legend>إضافة مستخدم</legend>
      <div class="form-row">
        <div class="input-data">
          <label>الاسم الأول</label>
          <input type="text" placeholder="الاسم الأول" formControlName="firstName">
        </div>
        <div class="input-data">
          <label>الاسم الثاني</label>
          <input type="text" placeholder="الاسم الثاني" formControlName="lastName">
        </div>
      </div>
      <div class="form-row">
        <div class="input-data">
          <label>اسم المستخدم</label>
          <input type="text" placeholder="اسم المستخدم" formControlName="username">
          <small *ngIf="registerForm.get('username')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label>الرقم السري</label>
          <input type="text" id="password" name="password" formControlName="password">
          <small *ngIf="registerForm.get('password')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label>رقم الموبايل</label>
          <input type="text" placeholder="رقم الموبايل" formControlName="phone">
        </div>
      </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">حفظ</button>
    </div>
  </form>

  </div>
</div>
