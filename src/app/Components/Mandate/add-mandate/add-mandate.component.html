<app-navbar></app-navbar>
<div class="row">
  <div class="col-10" style="background-color:var(--bg_main)">
    <form class="col-10" [formGroup]="exportForm" (ngSubmit)="onSubmit()">

      <div class="wrapper " style="direction: ltr;">
        <legend class="text-center">ادخال المنتدبين</legend>

<!--        <div class="input-data" style="width:20%; margin-left:auto;">-->
<!--          <input type="number" readonly id="no" name="no">-->
<!--          <label for="no" style="margin-right: 85%;color: var(&#45;&#45;color);margin-bottom:-5px"-->
<!--                 readonly>{{ numberOfMandate }}</label>-->
<!--          <label for="no" style="color: var(&#45;&#45;color)">المسلسل </label>-->
<!--        </div>-->
        <div class="d-flex">
          <div class="input-data" style="width:20%; margin-left:auto;">
            <input type="text" id="department" name="department"
                   formControlName="department" required>
            <label for="department">القسم </label>
          </div>
          <div class="input-data" style="width:20%; margin-left:auto;">
            <input type="text" required id="name" name="name" formControlName="name">
            <label for="name">اسم عضو هيئة التدريس </label>
          </div>
          <div class="input-data" style="width:20%; margin-left:auto;">
            <input type="text" required id="degree" name="degree" formControlName="degree">
            <label for="degree">الدرجة </label>
          </div>
          <div class="input-data" style="width:20%; margin-left:auto;">
            <input type="text" required id="deputationUniversity" name="deputationUniversity"
                   formControlName="deputationUniversity">
            <label for="deputationUniversity"> الكلية/الجامعة المنتسب إليها </label>
          </div>
        </div>
        <div class="d-flex">

          <div class="MandatePeriod">
            <div class="input-data" style="width:96%; margin-left: auto;">
              <!--            <input cols="40" rows="1" required id="summary" name="summary" formControlName="summary">-->
              <label for> فترة الإنتداب </label>
            </div>
            <input type="radio" name="gender" value="male"> الترم الأول
            <input type="radio" name="gender" value="female"> الترم الثاني
            <input type="radio" name="gender" value="unknown"> العام كامل
          </div>
          <div class="weekDays-selector" style="margin-left: 100px">

            <div class="input-data" style="width:96%; margin-left: auto;">
              <!--            <input cols="40" rows="1" required id="summary" name="summary" formControlName="summary">-->
              <label for> أيام الإنتداب</label>
            </div>
            <input type="checkbox" id="weekday-mon" class="weekday"/>
            <label for="weekday-mon">الخميس</label>
            <input type="checkbox" id="weekday-tue" class="weekday"/>
            <label for="weekday-tue">الأربعاء</label>
            <input type="checkbox" id="weekday-wed" class="weekday"/>
            <label for="weekday-wed">الثلاثاء</label>
            <input type="checkbox" id="weekday-thu" class="weekday"/>
            <label for="weekday-thu">الأثنين</label>
            <input type="checkbox" id="weekday-fri" class="weekday"/>
            <label for="weekday-fri">الأحد</label>
            <input type="checkbox" id="weekday-sat" class="weekday"/>
            <label for="weekday-sat">السبت</label>
          </div>
        </div>

        <div style="margin-top: 10px">
            <!--            <input cols="40" rows="1" required id="summary" name="summary" formControlName="summary">-->
            <label style="margin-left: 90%;font-weight: bold"> قرار مجلس القسم </label>

          <div class="d-flex">
            <div class="d-flex" style="width:30%;">
              <input type="radio" name="gender" value="male" style="margin-left: 150px">لا
              <input type="radio" name="gender" value="female" style="margin-left: 30px"> نعم
              <div class="input-data">
                <label for> موافقة </label>
              </div>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" required id="name" name="name" formControlName="name">
              <label for="name">بتاريخ </label>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" id="department" name="department"
                     formControlName="department" required>
              <label for="department">محضر رقم </label>
            </div>
          </div>

        </div>

        <div style="margin-top: 10px">
            <label style="font-weight: bold;margin-left: 90%"> قرار مجلس الكلية </label>
          <div class="d-flex">
            <div class="d-flex" style="width:30%;">
              <input type="radio" name="gender" value="male" style="margin-left: 150px">لا
              <input type="radio" name="gender" value="female" style="margin-left: 30px"> نعم
              <div class="input-data">
                <label for> موافقة </label>
              </div>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" required id="name" name="name" formControlName="name">
              <label for="name">بتاريخ </label>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" id="department" name="department"
                     formControlName="department" required>
              <label for="department">محضر رقم </label>
            </div>
          </div>

        </div>

        <div style="margin-top: 10px">
            <label style="margin-left: 90%;font-weight: bold"> قرار رئيس الجامعة </label>
          <div class="d-flex">
            <div class="d-flex" style="width:30%;">
              <input type="radio" name="gender" value="male" style="margin-left: 150px">لا
              <input type="radio" name="gender" value="female" style="margin-left: 30px"> نعم
              <div class="input-data">
                <label for> موافقة </label>
              </div>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" required id="name" name="name" formControlName="name">
              <label for="name">بتاريخ </label>
            </div>
            <div class="input-data" style="width:30%; margin-left:auto;">
              <input type="text" id="department" name="department"
                     formControlName="department" required>
              <label for="department">محضر رقم </label>
            </div>
          </div>

        </div>


        <div class="d-flex">
          <button type="submit" class="btn  " [disabled]="!exportForm.valid"
                  style="width:100px; padding:1px;color: var(--color);background: var(--bg_hover);font-size:22px;margin-right:10%">
            حفظ
          </button>
          <div class="input-data" style="width:100%; margin:auto;">
            <input type="text" required id="num" name="num" formControlName="num">
            <label for="num">ملاحظات </label>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
