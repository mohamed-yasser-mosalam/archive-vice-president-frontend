<div class="page page-narrow">
  <form class="form-card" [formGroup]="specialUniversityForm" (ngSubmit)="onSubmit()">
    <div class="wrapper ">
      <legend class="text-center">ادخال جامعة إستثنائية</legend>

      <div class="input-data">
        <input type="text" required id="university" name="university" formControlName="university">
        <label for="university">اسم الجامعة</label>

      </div>
      <button type="submit" class="btn btn-primary" [disabled]="!specialUniversityForm.valid">حفظ</button>
    </div>
  </form>
</div>
