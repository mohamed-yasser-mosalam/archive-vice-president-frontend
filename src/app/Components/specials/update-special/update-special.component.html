<app-navbar></app-navbar>

<div class="row" style="background-color: var(--bg);">
  <div class="d-flex justify-content-between">

    <div class="d-flex w-100">
      <div style="width: 20%;"></div>
      <form style="width:71%;zoom: 80%" #myForm="ngForm" (ngSubmit)="onSubmit(myForm.value)">
        <div class="wrapper">
          <legend class="text-center">تعديل ملف خاص</legend>
          <div style="display: flex;  justify-content: space-between;">

            <div class="input-container">

              <div class="input-data">
                <input type="text"   id="sender" name="sender" [(ngModel)]="special.sender">
                <div class="underLine"></div>
                <label for="sender">الجهة الوارد منها الخطاب</label>
              </div>
            </div>

            <div class="input-container">

              <div class="input-data">
                <input type="number"   id="archiveId" name="archiveId" [(ngModel)]="special.archiveId">
                <div class="underLine"></div>
                <label for="archiveId">رقم الملف</label>
              </div>
            </div>
          </div>
          <div class="input-data">
            <input type="text"   id="summary" name="summary" [(ngModel)]="special.summary">
            <div class="underLine"></div>
            <label for="summary" style="margin-right: 0!important;">ملخص الخطاب</label>
          </div>
          <div style="display: flex;  justify-content: space-between;">

            <div class="input-container">

              <div class="input-data">
                <input type="date" required id="incomeDate" name="incomeDate" [(ngModel)]="special.incomeDate">
                <div class="underLine"></div>
                <label for="incomeDate">تاريخ </label>
              </div>
            </div>

            <div class="input-container">

              <div class="input-data">
                <input type="number" required id="numberOfAttachments" name="numberOfAttachments"[(ngModel)]="special.numberOfAttachments">
                <div class="underLine"></div>
                <label for="numberOfAttachments">عدد المرفقات</label>
              </div>
            </div>
          </div>
          <div style="overflow: scroll">
            <div *ngFor="let subject of special.subjects; let i = index">
              <div class="subjects  input-container" style="display:inline-flex;width: 100% ">

                <div class="input-data">
                  <input type="text" required id="head" name="head{{i}}" [(ngModel)]="subject.head">
                  <div class="underLine"></div>
                  <label for="head"> اضافة موضوع </label>
                </div>
                <div class="input-data" style="margin-left: 20px">
                  <input type="number" required name="num{{i}}" [(ngModel)]="subject.num">
                  <div class="underLine"></div>
                  <label > رقم موضوع </label>
                </div>
              </div>

              <div style="overflow: scroll">
                <div *ngFor="let decision of subject.decisions; let j = index">

                  <div class="subjects input-container" style="display:inline-flex;width: 100% ">

                    <div class="input-data">
                      <input type="text" required name="summary{{i}}{{j}}" [(ngModel)]="decision.summary">
                      <div class="underLine"></div>
                      <label for="summary"> موضوع القرار </label>
                    </div>
                    <div class="input-data" style="margin-left: 20px">
                      <input type="number" required name="num{{i}}{{j}}" [(ngModel)]="decision.num">
                      <div class="underLine"></div>
                      <label > رقم القرار </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn" style="color: white;background-color: #333333;width:150px;height:30px;">تأكيد
          الحفظ
        </button>
      </form>
    </div>

    <div>
      <app-sidebar></app-sidebar>
    </div>

  </div>
</div>
