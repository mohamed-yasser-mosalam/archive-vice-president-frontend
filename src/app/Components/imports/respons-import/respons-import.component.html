<div class="page page-narrow">
  <form class="form-card"  [formGroup]="importResponse" (ngSubmit)="onSubmit()">

    <div class="wrapper ">
      <legend class="text-center">ادخال رد </legend>

      <div class="input-data">
        <input type="text" readonly id="no" name="no" [value]="numberOfExportFile ?? ''">
        <label for="no">رقم القيد</label>
      </div>
      <div class="d-flex">
        <div class="input-data">
          <input type="text" required id="receiver" name="receiver" formControlName="receiver">
          <label for="receiver">الجهة الصادر اليها الخطاب</label>
          <small *ngIf="importResponse.get('receiver')?.invalid">* مطلوب</small>
        </div>

        <div class="input-data">
          <input type="text" required  id="numberOfAttachments" name="numberOfAttachments"
                 formControlName="numberOfAttachments">
          <label for="numberOfAttachments">عدد المرفقات</label>
          <small *ngIf="importResponse.get('numberOfAttachments')?.invalid">* مطلوب</small>

        </div>
        <div class="input-data">
          <input type="date" required id="date" name="date" formControlName="date">
          <label for="date">تاريخ الصادر</label>
          <small *ngIf="importResponse.get('date')?.invalid">* مطلوب</small>
        </div>
      </div>
      <div class="input-data">
        <input cols="40" rows="1"  required id="summary" name="summary" formControlName="summary">
        <label for="summary">ملخص الخطاب</label>
        <small *ngIf="importResponse.get('summary')?.invalid">* مطلوب</small>

      </div>
      <div class="d-flex">
        <div class="input-data">
          <label for="num">ملف الحفظ</label>
          <small *ngIf="importResponse.get('num')?.invalid">* مطلوب</small>
          <select type="text" required id="num" name="num" formControlName="num">
            <option *ngFor="let i of allFiles" value="{{i.num}}">{{ i.name }} - {{ i.num }}</option>
          </select>
        </div>
        <div class="input-data">
          <input type="text" id="recipientName" name="recipientName" formControlName="recipientName">
          <label for="recipientName">المستلم</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!importResponse.valid"> حفظ
      </button>
    </div>
  </form>
</div>
