<div class="page page-narrow">
  <form class="form-card"  [formGroup]="editTeachingPhone" (ngSubmit)="update()">
      <div class="wrapper ">
          <legend class="text-center">تعديل دليل الاتصال بأعضاء هيئة التدريس</legend>

          <div class="d-flex">
            <div class="input-data">
              <input type="number" formControlName="id" readonly>
              <label >القيد</label>
            </div>
            <div class="input-data">
              <input type="text" formControlName="name">
              <label >الأسم</label>
            </div>
            <div class="input-data">
              <input type="text" formControlName="job">
              <label >الوظيفة</label>
            </div>
          </div>
          <div class="input-data">
            <input cols="40" rows="1"  formControlName="department">
            <label>القسم</label>

          </div>
          <div class="d-flex">
            <div class="input-data">
              <input type="text" formControlName="phone">
              <label>الموبايل</label>

            </div>
            <div class="input-data">
              <input type="text" formControlName="address">
              <label>العنوان</label>
            </div>
          </div>
        <div class="d-flex">
          <div class="input-data">
            <input type="text" id="mobile" name="mobile" formControlName="mobile">
            <label for="mobile">الطوارئ</label>
          </div>
          <div class="input-data">
            <input type="text" id="email" name="email" formControlName="email">
            <label for="email">الايميل</label>
          </div>
        </div>

        <div class="input-data">
            <input type="text" formControlName="notes">
            <label >الملاحظات</label>
          </div>

            <button type="submit" class="btn btn-primary">حفظ</button>
      </div>
  </form>
</div>
