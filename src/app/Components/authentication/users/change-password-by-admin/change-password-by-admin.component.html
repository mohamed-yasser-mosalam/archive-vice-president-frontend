<div class="page page-narrow">
  <div class="profile-layout">
  <form class="form-card" #ModifyPassword="ngForm" (ngSubmit)="changePassword(ModifyPassword.value)">
    <legend>تغيير الرقم السري</legend>
        <div class="input-data">
          <label>الرقم السري الجديد</label>
          <input type="password" required id="newPassword" name="newPassword" ngModel>
        </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">حفظ</button>
    </div>
  </form>
  <aside class="profile-card">
    <img class="profile-avatar" [src]="img" alt="">
    <div class="profile-name">{{ name }}</div>
  </aside>
  </div>
</div>
