<div class="page">
  <div class="detail-layout">
    <div class="detail-main">
      <form class="form-card" [formGroup]="showImport">
        <div class="wrapper">
          <legend class="text-center"> الخطابات الواردة
            (0/1)</legend>

          <div>
            <div class="input-container ">
              <div class="d-flex">
                <div class="input-data">
                  <input type="number" readonly id="numberOfImages" formControlName="numberOfImages">
                  <div class="underLine"></div>
                  <label for="numberOfImages"> عدد المرفقات الفعلي</label>
                </div>
                <div class="input-data">
                  <input type="text" required readonly id="numberOfAttachments" formControlName="numberOfAttachments">
                  <label for="numberOfAttachments">عدد المرفقات</label>
                </div>
              </div>
              <div class="input-data">
                <input type="text" required readonly id="sender" formControlName="sender">
                <label for="sender">الجهة الوارد منها الخطاب</label>
              </div>
            </div>
            <div class="input-container">
              <div class="d-flex">
                <div class="input-data">
                  <input type="text" required readonly id="incomeDate" formControlName="incomeDate">
                  <label for="incomeDate">تاريخ الورود</label>
                </div>
                <div class="input-data ">
                  <input type="number" required readonly id="no" formControlName="no">
                  <label for="no">رقم القيد</label>
                </div>
              </div>
              <div class="d-flex">
                <div class="input-data">
                  <input type="Date" required readonly id="incomingLetterDate" formControlName="incomingLetterDate">
                  <label for="incomingLetterDate">تاريخه</label>
                </div>
                <div class="input-data ">
                  <input type="number" required readonly id="incomingLetterNumber" formControlName="incomingLetterNumber">
                  <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
                </div>
              </div>
            </div>
          </div>
          <div class="input-data">
            <input readonly required id="summary" formControlName="summary">
            <label for="summary">ملخص الخطاب</label>
          </div>

          <div>
            <div class="input-container position-relative">
              <div class="input-data">
                <input type="text" required readonly id="responseSide" formControlName="responseSide">
                <label for="responseSide">الجهة الصادر اليها </label>
              </div>
              <div class="input-data">
                <input type="Date" required readonly id="recipientDate" formControlName="recipientDate">
                <label for="recipientDate">تاريخ الاستلام</label>
              </div>

              <div class="d-flex">
                <div class="input-data">
                  <input type="date" required readonly id="expectResponseDate" formControlName="expectResponseDate">
                  <label for="expectResponseDate">التاريخ المتوقع للرد</label>
                </div>

                <div class="input-data">
                  <input type="text" required readonly id="createdBy" formControlName="createdBy">
                  <label for="createdBy">انشأ بواسطة </label>
                </div>
              </div>
            </div>
            <div class="input-container position-relative">
              <div>
                <div class="input-data w-50">
                  <input type="Date" required readonly id="responseDate" formControlName="responseDate">
                  <label for="responseDate">تاريخ الرد</label>
                </div>
                <div class="input-data">
                  <input type="text" required readonly id="responseNumber" formControlName="responseNumber">
                  <label for="responseNumber">الرد</label>
                </div>
              </div>
              <div class="input-data">
                <input type="text" required readonly id="recipientName" formControlName="recipientName">
                <label for="recipientName">المستلم</label>
              </div>
              <div class="input-data">
                <input type="text" required readonly id="num" formControlName="num">
                <label for="num">رقم الملف</label>
              </div>


            </div>
          </div>
          <div class="input-data">


            <div class="detail-pager">
              <ngb-pagination [(page)]="page" [pageSize]="size" [collectionSize]="pageLength" (pageChange)="change($event)"
                              [maxSize]="1" [boundaryLinks]="true" [ellipses]="false" [rotate]="false">
              </ngb-pagination>
            </div>

          </div>
        </div>
      </form>
    </div>

    <aside class="detail-media">
      <div class="detail-media-title">المرفقات</div>
      <div class="empty-state no-attachments" *ngIf="!paths || !paths.length">لا توجد مرفقات لهذا السجل</div>
      <ngb-carousel class="w-100">
        <ng-template ngbSlide *ngFor="let item of paths;let i=index">
          <div class="carousel-wrapper" [id]="'print-section-' + i">
            <img src="{{item}}">
          </div>
          <div class="d-flex">

            <button [printSectionId]="'print-section-' + i"   ngxPrint
                    class="btn btn-outline-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-printer" viewBox="0 0 16 16">
                <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1"/>
              </svg>
              طباعة
            </button>
          </div>
        </ng-template>
      </ngb-carousel>
    </aside>
  </div>
</div>
