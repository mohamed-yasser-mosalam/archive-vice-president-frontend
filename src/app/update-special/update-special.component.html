<app-navbar xmlns="http://www.w3.org/1999/html"></app-navbar>
<div class="row" >
   <div class="col-4"></div>
  <form class="col-6" style="zoom: 70%;direction: ltr" [formGroup]="editSpecial" (ngSubmit)="update()">

    <div class="wrapper">
      <legend class="text-center"style="font-weight: bold"> الملفات الخاصة (3/0) </legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container ">
          <div class="input-data">
            <input type="number" required   id="archiveId" formControlName="archiveId">
            <label for="archiveId">رقم الخطاب</label>
          </div>
          <div class="input-data" style="top:32px">
            <input type="text" required   id="sender" formControlName="sender">
            <label for="sender">الجهة الوارد منها اليها الخطاب</label>
          </div>
        </div>
        <div class="input-container">
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="text" required readonly id="numberOfAttachments" formControlName="numberOfAttachments">
              <label for="numberOfAttachments">عدد المرفقات</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="number" required readonly id="id" formControlName="id">
              <label for="id">رقم القيد</label>
            </div>
          </div>
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="text" required   id="incomeDate" formControlName="incomeDate">
              <label for="incomeDate">تاريخ الورود</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="text" required   id="num" formControlName="num">
              <label for="num">رقم الملف</label>
            </div>
          </div>
        </div>
      </div>

      <div class="input-data">
        <input cols="40" rows="1" style="height:60px"   required id="summary" formControlName="summary">
        <label for="summary">ملخص الخطاب</label>
      </div>

         <div style="display: flex;">
          <div class="input-data">
            <input id="AddingAttachment" type="file" name="img" accept="image/*" (change)="onImageSelected($event)"  >
            <div class="underLine"></div>
            <label for="AddingAttachment">اختيار مرفق</label>
          </div>
        </div>


      <div  class="input-data"style="bottom: 0px; ">
        <button type="submit"  class="btn w-25"  style="padding:10px;background: #333333;color: white;margin-left:35%;margin-top: 20px">    حفظ  </button>
      </div>
    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
