<app-navbar></app-navbar>
<div class="row">
  <div class="col-2" style="background-color: var(--bg_main);"></div>
  <div class="col-9" style="background-color:var(--bg_main)">
    <form class="col-8" [formGroup]="teachingForm" (ngSubmit)="onSubmit()">

      <div class="wrapper " style="direction: ltr;">
        <legend class="text-center">ادخال أرقام أعضاء هيئة التدريس</legend>

        <div class="d-flex">
          <div class="input-data" style="width:30%; margin-left:auto;">
            <input type="number" required id="serial" name="serial" formControlName="serial">
            <label for="serial">القيد</label>
            <small *ngIf="teachingForm.get('receiver')?.invalid">* مطلوب</small>
          </div>

          <div class="input-data" style="width:30%; margin-left:auto;">
            <input type="text"  id="name" name="name"
                   formControlName="name" required>
            <label for="name">الأسم</label>

          </div>
          <div class="input-data" style="width:30%; margin-left:auto;">
            <input type="text" id="job" name="job" formControlName="job">
            <label for="job">الوظيفة</label>
           </div>
        </div>
        <div class="input-data" style="width:96%; margin-left: auto;">
          <input cols="40" rows="1"  required id="department" name="department" formControlName="department">
          <label for="department">القسم</label>

        </div>
        <div class="d-flex">
          <div class="input-data" style="width:40%; margin:auto;">
            <input type="text" required id="phone" name="phone"  formControlName="phone">
            <label for="phone">الموبايل</label>

          </div>
          <div class="input-data" style="width:45%; margin-left:auto;">
            <input type="text" id="address" name="address" formControlName="address"  >
            <label for="address">العنوان</label>
          </div>
        </div>
        <div class="d-flex">
          <div class="input-data" style="width:40%; margin:auto;">
            <input type="text" id="mobile" name="mobile" formControlName="mobile">
            <label for="mobile">الطوارئ</label>
          </div>
          <div class="input-data" style="width:45%; margin-left:auto;">
            <input type="text" id="email" name="email" formControlName="email">
            <label for="email">الايميل</label>
          </div>
        </div>

        <div class="input-data" style="width:45%; margin-left:auto;">
          <input type="text" id="notes" name="notes" formControlName="notes" >
          <label for="notes">الملاحظات</label>
        </div>

        <button type="submit" class="btn  " [disabled]="!teachingForm.valid"
                style="width:100px; padding:1px;color: var(--color);background: var(--bg_hover);font-size:22px;margin-right:10%"> حفظ
        </button>
      </div>
    </form>
  </div>
  <div class="col-1">
    <app-sidebar></app-sidebar>
  </div>
</div>
