<div class="page page-narrow">
  <div class="profile-layout">
  <form class="form-card" [formGroup]="editUserName">
    <legend>بيانات المستخدم</legend>
      <div class="form-row">
        <div class="input-data">
          <label>الاسم الأول</label>
          <input type="text" readonly formControlName="firstName">
        </div>
        <div class="input-data">
          <label>الاسم الثاني</label>
          <input type="text" readonly formControlName="lastName">
        </div>
      </div>
      <div class="form-row">
        <div class="input-data">
          <label>اسم المستخدم</label>
          <input type="text" readonly formControlName="username">
        </div>
        <div class="input-data">
          <label>رقم الموبايل</label>
          <input type="text" readonly formControlName="phone">
        </div>
        <div class="input-data">
          <label>الصلاحية</label>
          <input type="text" readonly formControlName="roles">
        </div>
      </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="button" routerLink="/update-user-information/{{id}}">تعديل البيانات</button>
      <button class="btn btn-outline-secondary" type="button" routerLink="/change-password/{{userName}}">تغيير الرقم السري</button>
    </div>
  </form>
  <aside class="profile-card">
    <img class="profile-avatar" [src]="img" alt="">
    <div class="profile-name">{{ userName }}</div>
    <label class="btn btn-sm btn-outline-secondary profile-upload">
      تغيير الصورة
      <input type="file" name="img" accept="image/*" hidden (change)="onImageSelected($event)">
    </label>
  </aside>
  </div>
</div>
