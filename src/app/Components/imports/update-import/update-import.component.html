<div class="page">
  <div class="detail-layout">
    <div class="detail-main">
      <form class="form-card" [formGroup]="editImport" (ngSubmit)="update()">

        <div class="wrapper">
          <legend class="text-center">{{ no }} تعديل ملف وارد رقم</legend>
          <div>
            <div class="input-container ">

              <div class="input-data">
                <input type="text"  id="numberOfAttachments" formControlName="numberOfAttachments">
                <label for="numberOfAttachments">عدد المرفقات</label>
              </div>
              <div class="input-data">
                <input type="text" id="sender" formControlName="sender">
                <label for="sender">الجهة الوارد منها الخطاب</label>
              </div>
            </div>
            <div class="input-container">
              <div class="d-flex">
                <div class="input-data">
                  <input type="Date" id="incomeDate" formControlName="incomeDate">
                  <label for="incomeDate">تاريخ الورود</label>
                </div>
                <div class="input-data ">
                  <input type="number" readonly id="no" formControlName="no">
                  <label for="no">رقم القيد</label>
                </div>
              </div>
              <div class="d-flex">
                <div class="input-data">
                  <input type="text" id="incomingLetterDate" formControlName="incomingLetterDate">
                  <label for="incomingLetterDate">تاريخه</label>
                </div>
                <div class="input-data ">
                  <input type="number" id="incomingLetterNumber" formControlName="incomingLetterNumber">
                  <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
                </div>
              </div>
            </div>
          </div>
          <div class="input-data">
            <input type="text" id="summary" formControlName="summary">
            <label for="summary">ملخص الخطاب</label>
          </div>

          <div>
            <div class="input-container position-relative" >
              <div class="input-data">
                <input type="text" readonly id="responseSide" formControlName="responseSide">
                <label for="responseSide">الجهة الصادر اليها </label>
              </div>
              <div class="input-data">
                <input type="Date" id="recipientDate" formControlName="recipientDate">
                <label for="recipientDate">تاريخ الاستلام</label>
              </div>
              <div class="input-data">
                <input type="Date" required id="expectResponseDate" formControlName="expectResponseDate">
                <label for="expectResponseDate">التاريخ المتوقع للرد</label>
              </div>

              <div class="input-data">
                <button type="submit" class="btn btn-primary"
                > حفظ
                </button>
              </div>

            </div>
            <div class="input-container position-relative" >
              <div>
                <div class="input-data w-50">
                  <input type="Date" readonly id="responseDate" formControlName="responseDate">
                  <label for="responseDate">تاريخ الرد</label>
                </div>
                <div class="input-data">
                  <input type="text" readonly id="responseNumber" formControlName="responseNumber">
                  <label for="responseNumber">الرد</label>
                </div>
              </div>
              <div class="input-data">
                <input type="text" id="recipientName" formControlName="recipientName">
                <label for="recipientName">المستلم</label>
              </div>
              <div class="input-data">
                <input type="text" id="num" formControlName="num">
                <label for="num">رقم الملف</label>
              </div>

            </div>
          </div>
        </div>
      </form>
    </div>

    <aside class="detail-media">
      <div class="detail-media-title">المرفقات</div>
      <div class="empty-state no-attachments" *ngIf="!paths || !paths.length">لا توجد مرفقات لهذا السجل</div>
      <ngb-carousel class="w-100">
        <ng-template ngbSlide *ngFor="let item of paths;let i=index">
          <div class="carousel-wrapper">
            <img src="{{item}}">
          </div>
          <div class="d-flex">
            <button *ngIf="roleOfUser=='admin'||roleOfUser=='manager'" type="submit" (click)="deleteImage(i)"
                    class="btn btn-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3"
                   viewBox="0 0 16 16">
                <path
                  d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
              </svg>
              حذف المرفق
            </button>
          </div>
        </ng-template>
      </ngb-carousel>
    </aside>
  </div>
</div>
