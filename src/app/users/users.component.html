<app-navbar></app-navbar>

<div class="row" style="background-color: var(--bg);">
  <div class="d-flex justify-content-between">
    <div class="w-100"
         style=" zoom: 80%; background-color: var(--bg); text-align: center; overflow: auto; height:733px; border-radius: 8px;">

      <div class="row">

        <h2
          style="font-size: 20px; padding: 10px 0; background-color: var(--bg); color:var(--color);; position: sticky; top: 0; width: 100%;font-weight: bold">
          عرض المستخدمين </h2>

        <table>
          <thead>
          <tr>
            <th scope="col">الاسم الاول</th>
            <th scope="col">الاسم الثاني</th>
            <th scope="col">اسم المستخدم</th>
            <th scope="col">صلاحيات</th>
            <th scope="col">تغيير الرقم السري</th>
            <th scope="col">تفعيل والغاء تفعيل</th>
            <th scope="col">النشاط</th>
          </tr>
          </thead>
          <tbody>

          <tr *ngFor="let item of showUsers ">
            <td>{{ item.firstName }}</td>
            <td>{{ item.lastName }}</td>
            <td>{{ item.username }}</td>
            <td>{{ item.roles }}</td>
            <td>
              <a routerLink="/changepasswordbyadmin/{{item.id}}"
                 *ngIf="item.roles!='admin' ">
                <button type="submit" class="btn btn-outline-dark"
                        style="width:150px;color: var(--color);background:var(--bg_main);font-size:20px;margin-top:10px;margin-right: 10px;font-weight: bold ">
                  تغيير الرقم السري
                </button>
              </a>
            </td>

            <td *ngIf="item.isActive==1;else notactive">
              <button (click)="unActivateUser(item.username)" type="button" class="btn btn-outline-dark "
                      style="width:150px;color: var(--color);background:var(--bg_main);font-size:20px;margin-top:10px;margin-right: 10px;font-weight: bold ">
                الغاء تفعيل
              </button>
            </td>
            <ng-template #notactive>
              <button (click)="activatedUser(item.username)" type="button" class="btn btn-outline-dark"
                      style="width:150px;color: var(--color);background:var(--bg_main);font-size:20px;margin-top:10px;margin-right: 10px;font-weight: bold ">
                تفعيل
              </button>
            </ng-template>


            <td *ngIf="item.isActive;else notActive">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell-fill"
                   viewBox="0 0 16 16">
                <path
                  d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"/>
              </svg>
            </td>
            <ng-template #notActive>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                   class="bi bi-bell-slash-fill" viewBox="0 0 16 16">
                <path
                  d="M5.164 14H15c-1.5-1-2-5.902-2-7q0-.396-.06-.776zm6.288-10.617A5 5 0 0 0 8.995 2.1a1 1 0 1 0-1.99 0A5 5 0 0 0 3 7c0 .898-.335 4.342-1.278 6.113zM10 15a2 2 0 1 1-4 0zm-9.375.625a.53.53 0 0 0 .75.75l14.75-14.75a.53.53 0 0 0-.75-.75z"/>
              </svg>
            </ng-template>
            <td>
              <a routerLink="/userpagination/{{item.id}}">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                     class="bi bi-box-arrow-left" viewBox="0 0 16 16" style="color:var(--color)">
                  <path fill-rule="evenodd"
                        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                  <path fill-rule="evenodd"
                        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div>
      <app-sidebar></app-sidebar>
    </div>
  </div>
</div>
