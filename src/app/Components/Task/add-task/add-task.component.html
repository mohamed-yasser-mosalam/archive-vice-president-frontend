<div class="page page-narrow">
  <form class="form-card" (submit)="insert()" #addTaskFrom="ngForm">
    <legend>إضافة مهمة</legend>

    <div class="form-row">
      <div class="input-data">
        <label for="subject">الموضوع</label>
        <input type="text" id="subject" name="subject"
               [(ngModel)]="task.subject" placeholder="أدخل الموضوع" required>
      </div>
      <div class="input-data">
        <label for="date">التاريخ</label>
        <input type="date" id="date" name="date" [(ngModel)]="task.date" required>
      </div>
    </div>

    <div class="input-data">
      <label for="content">المحتوى</label>
      <textarea id="content" name="content" rows="5"
                [(ngModel)]="task.content" placeholder="أدخل المحتوى" required></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="addTaskFrom.invalid">حفظ</button>
      <button type="button" class="btn btn-outline-secondary" routerLink="/tasks">إلغاء</button>
    </div>
  </form>
</div>
