<div class="page page-narrow">
  <form class="form-card" [formGroup]="facultyForm" (ngSubmit)="onSubmit()">

    <div class="wrapper ">
      <legend class="text-center">ادخال الأرقام الداخلية للكلية</legend>

      <div class="d-flex">
        <div class="input-data">
          <input type="text" required id="serial" name="serial" formControlName="serial">
          <label for="serial">القيد</label>
          <small *ngIf="facultyForm.get('serial')?.invalid">* مطلوب</small>
        </div>

      </div>
      <div class="input-data">
        <input cols="40" rows="1"  required id="side" name="side" formControlName="side">
        <label for="side">الجهة</label>
        <small *ngIf="facultyForm.get('side')?.invalid">* مطلوب</small>

      </div>
      <div class="d-flex">

        <div class="input-data">
          <input type="text" id="phone" name="phone" formControlName="phone"  >
          <label for="phone">الرقم</label>
          <small *ngIf="facultyForm.get('phone')?.invalid">* مطلوب</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!facultyForm.valid"> حفظ
      </button>
    </div>
  </form>
</div>
