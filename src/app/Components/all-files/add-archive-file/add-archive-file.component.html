<app-navbar></app-navbar>
<div class="row">
  <div class="col-2" style="background-color: var(--bg_main);"></div>
  <div class="col-8" style="background-color:var(--bg_main)">
    <form class="col-8" >
        <div class="wrapper " style="direction: ltr;">
            <legend class="text-center">ادخال ملف الارشيف</legend>


            <div class="input-data" style="width:30%; margin-left:auto;">
                <input type="number" min="1" max="3" required id="receiver" name="receiver" formControlName="receiver">
                <label for="receiver">نوع الملف</label>
                
              </div>
              <div class="input-data" style="width:30%; margin-left:auto;">
                <input type="number" required id="receiver" name="receiver" formControlName="receiver">
                <label for="receiver">رقم الملف</label>
                
              </div>
              <div class="input-data" style="width:30%; margin-left:auto;">
                <input type="text" required id="receiver" name="receiver" formControlName="receiver">
                <label for="receiver">اسم الملف</label>
                
              </div>
        </div>
    </form>
  </div>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
