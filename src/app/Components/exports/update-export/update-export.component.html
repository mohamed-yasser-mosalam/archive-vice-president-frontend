<div class="page">
  <div class="detail-layout">
    <div class="detail-main">
      <form class="form-card" [formGroup]="editExport" (ngSubmit)="update()">

        <div class="wrapper">
          <legend class="text-center"> {{ no }}  تعديل خطاب
            صادر رقم
          </legend>

          <div>
            <div class="input-container ">
              <div class="input-data">
                <input type="number" id="numberOfAttachments" formControlName="numberOfAttachments">
                <label for="numberOfAttachments">عدد المرفقات</label>
              </div>
              <div class="input-data">
                <input type="text" id="receiver" formControlName="receiver">
                <label for="receiver">الجهة الصادر اليها الخطاب</label>
              </div>
            </div>
            <div class="input-container">
              <div class="d-flex">
                <div class="input-data ">
                  <input type="text" required id="num" formControlName="num">
                  <label for="num">رقم الملف</label>
                </div>


                <div class="input-data ">
                  <input type="number" readonly id="no" formControlName="no">
                  <label for="no">رقم الخطاب</label>
                </div>
              </div>
                <div class="input-data">
                  <input type="Date" id="date" formControlName="date">
                  <label for="date">تاريخ الصادر</label>
                </div>
            </div>
          </div>
          <div class="input-data">
            <input cols="40" rows="1" id="summary" formControlName="summary">
            <label for="summary">ملخص الخطاب</label>
          </div>
          <div class="d-flex">

          <div class="input-data">
            <input type="date" required id="recipientDate" name="recipientDate" formControlName="recipientDate">
            <div class="underLine"></div>
            <label for="recipientDate">تاريح الاستلام</label>
          </div>
          <div class="input-data">
            <input type="text" required id="recipientName" formControlName="recipientName">
            <label for="recipientName">المستلم</label>
          </div>
        </div>

          <div class="mt-5">
            <div>
              <div class="input-data">
                <input type="Date" readonly id="urgentDate" formControlName="urgentDate">
                <label for="urgentDate">تاريخ الاستعجال</label>
              </div>
              <div class="input-data">
                <input type="number" readonly id="urgentNum" formControlName="urgentNum">
                <label for="urgentNum">رقم الاستعجال</label>
              </div>
            </div>
            <div>
              <div class="input-data w-50">
                <input type="Date" readonly id="responseDate" formControlName="responseDate">
                <label for="responseDate">تاريخ الرد</label>
              </div>
              <div class="input-data">
                <input type="text" readonly id="responseNumber" formControlName="responseNumber">
                <label for="responseNumber">الرد</label>
              </div>
            </div>
          </div>

          <div class="input-data">
            <button type="submit" class="btn btn-primary"
            > حفظ
            </button>
          </div>

        </div>
      </form>
    </div>

    <aside class="detail-media">
      <div class="detail-media-title">المرفقات</div>
      <div class="empty-state no-attachments" *ngIf="!paths || !paths.length">لا توجد مرفقات لهذا السجل</div>
      <ngb-carousel class="w-100">
        <ng-template ngbSlide *ngFor="let item of paths;let i=index">
          <div class="carousel-wrapper">
            <img src="{{item}}">
          </div>
          <div class="d-flex">
            <button *ngIf="roleOfUser=='admin'||roleOfUser=='manager'" type="submit" (click)="deleteImage(i)"
                    class="btn btn-danger">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3"
                   viewBox="0 0 16 16">
                <path
                  d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
              </svg>
              حذف المرفق
            </button>
          </div>
        </ng-template>
      </ngb-carousel>
    </aside>
  </div>
</div>
