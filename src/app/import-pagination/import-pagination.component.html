<app-navbar xmlns="http://www.w3.org/1999/html"></app-navbar>
<div class="row">
  <ngb-carousel class="col-4" >
    <ng-template ngbSlide *ngFor="let item of paths">
      <div class="carousel-wrapper">
        <img  src="{{item}}" style="height:87vh">
      </div>
    </ng-template>
  </ngb-carousel>  <form class="col-6" style="zoom: 60%;" [formGroup]="showImport">
    <div class="wrapper">
      <legend class="text-center" style="font-weight: bold"> الخطابات الواردة (1/0)</legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container ">

          <div class="input-data">
            <input type="text" required readonly id="numberOfAttachments" formControlName="numberOfAttachments">
            <label for="numberOfAttachments">عدد المرفقات</label>
          </div>
          <div class="input-data" style="top:55px">
            <input type="text" required readonly id="sender" formControlName="sender">
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>
        </div>
        <div class="input-container">
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="text" required readonly id="incomeDate" formControlName="incomeDate">
              <label for="incomeDate">تاريخ الورود</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="number" required readonly id="id" formControlName="id">
              <label for="id">رقم القيد</label>
            </div>
          </div>
          <div class="d-flex">
            <div class="input-data" style="width: 55%">
              <input type="Date" required readonly id="incomingLetterDate" formControlName="incomingLetterDate">
              <label for="incomingLetterDate">تاريخه</label>
            </div>
            <div class="input-data " style="width:40%; margin-left:auto;">
              <input type="number" required readonly id="incomingLetterNumber" formControlName="incomingLetterNumber">
              <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
            </div>
          </div>
        </div>
      </div>
      <div class="input-data" style="bottom:20px">
        <input style="height:60px;" readonly required id="summary"
               formControlName="summary">
        <label for="summary" style="margin-bottom: 20px">ملخص الخطاب</label>
      </div>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container position-relative" style="bottom:60px">
          <div class="input-data">
            <input type="text" required readonly id="responseSide" formControlName="responseSide">
            <label for="responseSide" style="margin-bottom: 30px">الجهة الصادر اليها </label>
          </div>
          <div class="input-data">
            <input type="Date" required readonly id="recipientDate" formControlName="recipientDate">
            <label for="recipientDate">تاريخ الاستلام</label>
          </div>
          <input id="AddingAttachment" type="file" name="img" accept="image/*" (change)="onImageSelected($event)" style="margin-top: 20px;margin-left:0;font-size:30px">
          <div class="input-data"style="margin-left: 80px;margin-top:30px;bottom: 0px ">
            <div class="col-md-3">
              <ngb-pagination
                 [(page)]="page"
                [pageSize]="size"
                [collectionSize]="pageLength"
                (pageChange)="change()"
                [maxSize]="1"
                [boundaryLinks]="true"
                [ellipses]="false"
                [rotate]="false"
                routerLink="/imports-pagination?id/{{page}}">
              </ngb-pagination>
            </div>
          </div>


        </div>
        <div class="input-container position-relative" style="bottom:60px">
          <div style="display: flex;">
            <div class="input-data w-50">
              <input type="Date" required readonly id="responseDate" formControlName="responseDate">
              <label for="responseDate">تاريخ الرد</label>
            </div>
            <div class="input-data" style="width:35%; margin-left:auto;">
              <input type="text" required readonly id="responseNumber" formControlName="responseNumber">
              <label for="responseNumber">الرد</label>
            </div>
          </div>
          <div class="input-data" style="bottom: 55px;">
            <input type="text" required readonly id="recipientName" formControlName="recipientName">
            <label for="recipientName">المستلم</label>
          </div>
          <div class="input-data" style="bottom: 55px;">
            <input type="text" required readonly id="num" formControlName="num">
            <label for="num">رقم الملف</label>
          </div>
          <div class="input-data" style="bottom: 55px; ">
            <button type="submit" class="btn btn-success w-25" style="padding:10px;margin-right: 10px;color: white;background: #333333"
                    routerLink="/updateimport/{{page}}">
              تعديل
            </button>
            <button type="submit" class="btn btn-success w-25" style="padding:10px;margin-right: 10px;color: white;background: #333333"
                    routerLink="/addimportfile">
              اضافة
            </button>
            <button type="submit" class="btn  w-25" style="padding:10px;margin-right: 10px;color: white;background: #333333"
                    routerLink="/add-import-response/{{page}}">
              اضافه رد
            </button>

          </div>
        </div>

      </div>
    </div>
  </form>

  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
