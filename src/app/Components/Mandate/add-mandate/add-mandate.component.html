<div class="page page-narrow">
  <form class="form-card" [formGroup]="mandateForm" (ngSubmit)="onSubmit()">
    <legend>إدخال انتداب جديد</legend>

    <div class="form-section">
      <h3 class="form-section-title">بيانات عضو هيئة التدريس</h3>
      <div class="form-row">
        <div class="input-data">
          <label for="name">اسم عضو هيئة التدريس</label>
          <input type="text" id="name" formControlName="name" required>
          <small *ngIf="mandateForm.get('name')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="degree">الدرجة</label>
          <input type="text" id="degree" formControlName="degree" required>
          <small *ngIf="mandateForm.get('degree')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="department">القسم</label>
          <input type="text" id="department" formControlName="department" required>
          <small *ngIf="mandateForm.get('department')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="deputationUniversity">الكلية/الجامعة المنتدب إليها</label>
          <input type="text" id="deputationUniversity" formControlName="deputationUniversity" required>
          <small *ngIf="mandateForm.get('deputationUniversity')?.invalid">* مطلوب</small>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">فترة وأيام الإنتداب</h3>
      <div class="input-data">
        <label>فترة الإنتداب</label>
        <div class="choice-group">
          <label class="choice">
            <input type="radio" formControlName="deputationPeriod" value="1">
            <span>الترم الأول</span>
          </label>
          <label class="choice">
            <input type="radio" formControlName="deputationPeriod" value="2">
            <span>الترم الثاني</span>
          </label>
          <label class="choice">
            <input type="radio" formControlName="deputationPeriod" value="3">
            <span>العام كامل</span>
          </label>
        </div>
        <small *ngIf="mandateForm.get('deputationPeriod')?.invalid">* مطلوب</small>
      </div>
      <div class="input-data">
        <label>أيام الإنتداب</label>
        <div class="choice-group">
          <label class="choice" for="weekday-1">
            <input type="checkbox" id="weekday-1" (change)="onWeekdayChange($event, 1)"/>
            <span>السبت</span>
          </label>
          <label class="choice" for="weekday-2">
            <input type="checkbox" id="weekday-2" (change)="onWeekdayChange($event, 2)"/>
            <span>الأحد</span>
          </label>
          <label class="choice" for="weekday-3">
            <input type="checkbox" id="weekday-3" (change)="onWeekdayChange($event, 3)"/>
            <span>الأثنين</span>
          </label>
          <label class="choice" for="weekday-4">
            <input type="checkbox" id="weekday-4" (change)="onWeekdayChange($event, 4)"/>
            <span>الثلاثاء</span>
          </label>
          <label class="choice" for="weekday-5">
            <input type="checkbox" id="weekday-5" (change)="onWeekdayChange($event, 5)"/>
            <span>الأربعاء</span>
          </label>
          <label class="choice" for="weekday-6">
            <input type="checkbox" id="weekday-6" (change)="onWeekdayChange($event, 6)"/>
            <span>الخميس</span>
          </label>
        </div>
        <small *ngIf="mandateForm.get('deputationDaysIds')?.invalid">* مطلوب</small>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">قرار مجلس القسم</h3>
      <div class="form-row">
        <div class="input-data">
          <label>القرار</label>
          <div class="choice-group">
            <label class="choice"><input type="radio" formControlName="departmentAccept" value="1"><span>موافقة</span></label>
            <label class="choice"><input type="radio" formControlName="departmentAccept" value="0"><span>رفض</span></label>
          </div>
          <small *ngIf="mandateForm.get('departmentAccept')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="departmentDate">بتاريخ</label>
          <input type="date" id="departmentDate" formControlName="departmentDate" required>
          <small *ngIf="mandateForm.get('departmentDate')?.invalid">* مطلوب</small>
        </div>
        <div class="input-data">
          <label for="departmentSpecialNum">خاص رقم</label>
          <input type="number" id="departmentSpecialNum" formControlName="departmentSpecialNum">
        </div>
        <div class="input-data">
          <label for="departmentRecordNum">محضر رقم</label>
          <input type="number" id="departmentRecordNum" formControlName="departmentRecordNum" required>
          <small *ngIf="mandateForm.get('departmentRecordNum')?.invalid">* مطلوب</small>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">قرار مجلس الكلية</h3>
      <div class="form-row">
        <div class="input-data">
          <label>القرار</label>
          <div class="choice-group">
            <label class="choice"><input type="radio" formControlName="facultyAccept" value="1"><span>موافقة</span></label>
            <label class="choice"><input type="radio" formControlName="facultyAccept" value="0"><span>رفض</span></label>
          </div>
        </div>
        <div class="input-data">
          <label for="facultyDate">بتاريخ</label>
          <input type="date" id="facultyDate" formControlName="facultyDate">
        </div>
        <div class="input-data">
          <label for="facultySpecialNum">خاص رقم</label>
          <input type="number" id="facultySpecialNum" formControlName="facultySpecialNum">
        </div>
        <div class="input-data">
          <label for="facultyRecordNum">محضر رقم</label>
          <input type="number" id="facultyRecordNum" formControlName="facultyRecordNum">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">قرار رئيس الجامعة</h3>
      <div class="form-row">
        <div class="input-data">
          <label>القرار</label>
          <div class="choice-group">
            <label class="choice"><input type="radio" formControlName="universityAccept" value="1"><span>موافقة</span></label>
            <label class="choice"><input type="radio" formControlName="universityAccept" value="0"><span>رفض</span></label>
          </div>
        </div>
        <div class="input-data">
          <label for="universityDate">بتاريخ</label>
          <input type="date" id="universityDate" formControlName="universityDate">
        </div>
        <div class="input-data">
          <label for="universityRecordNum">وارد رقم</label>
          <input type="number" id="universityRecordNum" formControlName="universityRecordNum">
        </div>
      </div>
    </div>

    <div class="input-data">
      <label for="notes">ملاحظات</label>
      <input type="text" id="notes" formControlName="notes">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="!mandateForm.valid">حفظ</button>
      <button type="button" class="btn btn-outline-secondary" routerLink="/mandate-dashboard">إلغاء</button>
    </div>
  </form>
</div>
