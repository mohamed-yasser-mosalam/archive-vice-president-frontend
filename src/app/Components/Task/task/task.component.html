<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">المهام</h1>
      <p class="page-subtitle">المهام والتذكيرات المسجلة</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" routerLink="/add-task">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        إضافة مهمة
      </button>
    </div>
  </div>

  <div class="task-grid">
    <article class="task-card" *ngFor="let task of tasks" [class.notified-task]="task.notify">
      <div class="task-head">
        <h3>{{ task.subject }}</h3>
        <span class="pill" [class.pill-danger]="task.notify">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          {{ task.date }}
        </span>
      </div>
      <p class="task-content">{{ task.content }}</p>
      <div class="task-actions">
        <button class="btn btn-sm btn-outline-secondary" routerLink="/update-task/{{task.id}}">تعديل</button>
        <button class="btn btn-sm btn-danger" (click)="delete(task.id)">حذف</button>
      </div>
    </article>
  </div>

  <div class="card-panel empty-state" *ngIf="!tasks?.length">لا توجد مهام مسجلة</div>
</div>
