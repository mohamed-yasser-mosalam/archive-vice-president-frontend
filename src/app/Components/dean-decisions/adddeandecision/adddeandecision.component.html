<div class="page page-narrow">
  <form class="form-card"  [formGroup]="deanDecisionForm" (ngSubmit)="onSubmit()">

        <div class="wrapper ">
          <legend class="text-center"style="font-size:25px">ادخال قرار العميد</legend>

          <div class="input-data">
            <input type="text" readonly id="no" name="no" [value]="numberOfDeanDecisions ?? ''">
            <label for="no">رقم القيد</label>
          </div>
          <div class="d-flex">


  <!--          <div class="input-data">-->
  <!--            <input type="text"  id="numberOfAttachments" name="numberOfAttachments"-->
  <!--                   formControlName="numberOfAttachments">-->
  <!--            <label for="numberOfAttachments">عدد المرفقات</label>-->
  <!--            <small *ngIf="deanDecisionForm.get('numberOfAttachments')?.invalid">* مطلوب</small>-->

  <!--          </div>-->
            <div class="input-data">
              <input type="date" required id="date" name="date" formControlName="date">
              <label for="date">تاريخ  </label>
              <small *ngIf="deanDecisionForm.get('date')?.invalid">* مطلوب</small>
            </div>
          </div>
          <div class="input-data">
            <input cols="40" rows="1"  required id="summary" name="summary" formControlName="summary">
            <label for="summary">موضوع القرار</label>
            <small *ngIf="deanDecisionForm.get('summary')?.invalid">* مطلوب</small>

          </div>
          <div class="d-flex">
            <div class="input-data">
              <label for="num">ملف الحفظ</label>
              <small *ngIf="deanDecisionForm.get('num')?.invalid">* مطلوب</small>
              <select id="num" required name="num" formControlName="num">
                <option></option>
                <option *ngFor="let item of deanDecisionArchive"
                        [selected]="item.num" [value]="item.num"
                >{{ item.name }} - {{ item.num }}
                </option>
              </select>
            </div>

          </div>

          <button type="submit" class="btn btn-primary" [disabled]="!deanDecisionForm.valid"> حفظ
          </button>
        </div>
      </form>
</div>
