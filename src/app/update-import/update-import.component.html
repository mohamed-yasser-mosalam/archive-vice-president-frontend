<app-navbar></app-navbar>
<div class="row" >
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
  <form class="col-8" style="zoom: 80%"  [formGroup]="editImport" (ngSubmit)="update()" >
    <div class="wrapper">
      <legend class="text-center">تعديل الوارد</legend>
      <div style="display: flex;  justify-content: space-between;">

        <div class="input-container">


          <div class="input-data">
            <input type="date" required id="incomeDate" formControlName="incomeDate">
            <div class="underLine"></div>
            <label for="incomeDate">تاريخ الورود</label>
          </div>

          <div class="input-data">
            <input type="text" required  id="sender"  formControlName="sender">
            <div class="underLine"></div>
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>


          <div class="input-data">
            <input type="number" required id="incomingLetterNumber"  formControlName="incomingLetterNumber">
            <div class="undlerLine"></div>
            <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
          </div>


          <div class="input-data">
            <input type="date" required id="incomingLetterDate" formControlName="incomingLetterDate" >
            <div class="undlerLine"></div>
            <label for="incomingLetterDate">تاريخ الخطاب الوارد</label>
          </div>

          <button type="submit"  class="btn btn-success w-100"  style="padding:10px;">    حفظ  </button>

        </div>

        <div class="input-container">


          <div class="input-data">
            <input  cols="40" rows="1" required id="summary" formControlName="summary"  >
            <div class="underLine-text"></div>
            <label for="summary">ملخص الخطاب</label>
          </div>



          <div class="input-data">
            <input type="text" required  id="recipientName"formControlName="recipientName"  >
            <div class="underLine"></div>
            <label for="recipientName">المستلم</label>
          </div>

          <div class="input-data">
            <input type="date" required id="recipientDate" formControlName="recipientDate">
            <div class="underLine"></div>
            <label for="recipientDate">تاريخ الاستلام</label>
          </div>


          <div class="input-data">
            <input type="number" required id="num" formControlName="num" >
            <div class="undlerLine"></div>
            <label for="num">رقم الملف</label>
          </div>

          <div class="input-data">
            <input type="date" required id="expectResponseDate" formControlName="expectResponseDate"  >
            <div class="underLine"></div>
            <label for="expectResponseDate">تاريخ المتوقع للرد </label>
          </div>

        </div>
      </div>

    </div>
  </form>
</div>
