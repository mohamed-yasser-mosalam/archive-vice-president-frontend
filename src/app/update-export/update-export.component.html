<app-navbar xmlns="http://www.w3.org/1999/html"></app-navbar>
<div class="row">
  <div class="col-4"></div>
  <form class="col-6" style="zoom: 70%;direction: ltr"  [formGroup]="editExport" (ngSubmit)="update()" >

    <div class="wrapper">
            <legend class="text-center"style="font-weight: bold"> {{x}}  تعديل خطاب صادر رقم  </legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container ">

          <div class="input-data">
            <input type="Date" id="date" formControlName="date">
            <label for="date">تاريخ الصادر</label>
          </div>
          <div class="input-data" style="top:32px">
            <input type="text"  id="receiver" formControlName="receiver">
            <label for="receiver">الجهة الصادر اليها الخطاب</label>
          </div>
        </div>
        <div class="input-container">
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="number" readonly id="numberOfAttachments" formControlName="numberOfAttachments">
              <label for="numberOfAttachments">عدد المرفقات</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="number"  readonly id="id" formControlName="id">
               <label for="id">رقم الخطاب</label>
            </div>
          </div>
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="text" required   id="recipientName" formControlName="recipientName">
              <label for="recipientName">المستلم</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="text" required readonly id="num" formControlName="num">
              <label for="num">رقم الملف</label>
            </div>
          </div>
        </div>
      </div>
      <div class="input-data">
        <input cols="40" rows="1" style="height:60px" id="summary" formControlName="summary">
        <label for="summary">ملخص الخطاب</label>
      </div>

      <div class="mt-5" style="display: flex;  justify-content: space-between;">
        <div style="display: flex;">
          <div class="input-data" style="width:65%">
            <input type="Date" readonly id="urgentDate" formControlName="urgentDate">
            <label for="urgentDate">تاريخ الاستعجال</label>
          </div>
          <div class="input-data" style="width:30%; margin-left:10px;">
            <input type="number" readonly id="urgentNum" formControlName="urgentNum">
            <label for="urgentNum">رقم الاستعجال</label>
          </div>
        </div>
        <div style="display: flex;">
          <div class="input-data w-50">
            <input type="Date" readonly    id="responseDate" formControlName="responseDate">
            <label for="responseDate">تاريخ الرد</label>
          </div>
          <div class="input-data" style="width:35%; margin-left:auto;">
            <input type="text" readonly id="responseNumber" formControlName="responseNumber">
            <label for="responseNumber">الرد</label>
          </div>
        </div>
      </div>
      <div class="input-data">
        <input id="AddingAttachment" type="file" name="img" accept="image/*" (change)="onImageSelected($event)"  >
        <div class="underLine"></div>
        <label for="AddingAttachment">اختيار مرفق</label>
      </div>

      <div class="input-data"style="bottom: 55px; ">
        <button type="submit"  class="btn w-25"  style="padding:10px;background: #333333;color: white;margin-left:35%;margin-top: 20px">    حفظ  </button>
      </div>

     </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
