<header class="topbar">
  <div class="topbar-start">
    <div class="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      <span>{{ today }}</span>
    </div>
  </div>

  <div class="topbar-end">
    <a class="icon-btn" routerLink="/tasks" [class.has-alert]="notify" title="المهام">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="alert-dot" *ngIf="notify"></span>
    </a>

    <span class="divider"></span>

    <a class="user-chip" routerLink="/show-user-information/{{userName}}" title="الملف الشخصي">
      <img [src]="img" alt="" (error)="imgFailed = true" *ngIf="!imgFailed; else initials">
      <ng-template #initials><span class="avatar-fallback">{{ (name || '?').charAt(0) }}</span></ng-template>
      <span class="user-meta">
        <span class="user-name" dir="auto">{{ name }}</span>
        <span class="user-handle">{{ userName }}</span>
      </span>
    </a>
  </div>
</header>
