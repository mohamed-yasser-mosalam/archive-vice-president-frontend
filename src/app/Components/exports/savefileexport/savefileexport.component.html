<div class="page page-narrow">
  <form class="form-card"  [formGroup]="saveFileForm" (ngSubmit)="onSubmit()">
    <div class="wrapper ">
      <legend class="text-center">ادخال ملف حفظ</legend>

      <div class="input-data">
        <input type="number" id="num" name="num" formControlName="num">
        <label for="num"></label>
        <label for="num">رقم الملف</label>
      </div>
      <button type="submit" class="btn btn-primary">
        حفظ
      </button>
    </div>
  </form>
</div>
