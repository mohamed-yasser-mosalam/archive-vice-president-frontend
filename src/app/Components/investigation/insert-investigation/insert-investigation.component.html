<div class="page page-narrow">
  <form class="form-card" (submit)="insert()" #addTaskForm="ngForm">
    <legend>إضافة تحقيق</legend>

    <div class="form-section">
      <h3 class="form-section-title">بيانات الطالب والامتحان</h3>
      <div class="form-row">
        <div class="input-data">
          <label for="studentName">اسم الطالب</label>
          <input type="text" id="studentName" name="studentName" [(ngModel)]="investigation.studentName" required>
        </div>
        <div class="input-data">
          <label for="academicYear">الفرقة</label>
          <input type="text" id="academicYear" name="academicYear" [(ngModel)]="investigation.academicYear" required>
        </div>
        <div class="input-data">
          <label for="department">القسم</label>
          <input type="text" id="department" name="department" [(ngModel)]="investigation.department">
        </div>
        <div class="input-data">
          <label for="year">العام الجامعي</label>
          <input type="text" id="year" name="year" [(ngModel)]="investigation.year">
        </div>
        <div class="input-data">
          <label for="semester">الفصل الدراسي</label>
          <input type="text" id="semester" name="semester" [(ngModel)]="investigation.semester">
        </div>
        <div class="input-data">
          <label for="exam">المادة</label>
          <input type="text" id="exam" name="exam" [(ngModel)]="investigation.exam">
        </div>
        <div class="input-data">
          <label for="examDate">تاريخ الامتحان</label>
          <input type="date" id="examDate" name="examDate" [(ngModel)]="investigation.examDate">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">بيانات التحقيق</h3>
      <div class="form-row">
        <div class="input-data">
          <label for="investigationKind">نوع التحقيق</label>
          <input type="text" id="investigationKind" name="investigationKind" [(ngModel)]="investigation.investigationKind">
        </div>
        <div class="input-data">
          <label for="investigationName">اسم المحقق</label>
          <input type="text" id="investigationName" name="investigationName" [(ngModel)]="investigation.investigationName">
        </div>
        <div class="input-data">
          <label for="investigationDate">تاريخ التحقيق</label>
          <input type="date" id="investigationDate" name="investigationDate" [(ngModel)]="investigation.investigationDate">
        </div>
        <div class="input-data">
          <label for="belongings">المتعلقات</label>
          <input type="text" id="belongings" name="belongings" [(ngModel)]="investigation.belongings" placeholder="أدخل المتعلقات">
        </div>
      </div>
    </div>

    <div class="form-row">
        <div class="input-data">
          <label for="investigationResult">نتيجة التحقيق</label>
          <textarea id="investigationResult" name="investigationResult" rows="3" [(ngModel)]="investigation.investigationResult"></textarea>
        </div>
        <div class="input-data">
          <label for="result">نتيجة الاستئناف</label>
          <textarea id="result" name="result" rows="3" [(ngModel)]="investigation.result" placeholder="نتيجة الاستئناف"></textarea>
        </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="addTaskForm.invalid">حفظ</button>
      <button type="button" class="btn btn-outline-secondary" routerLink="/investigation">إلغاء</button>
    </div>
  </form>
</div>
