<app-navbar></app-navbar>

<div class="row">
  <div class="col-2"></div>
  <form class="col-8" style="zoom: 80%" #ModifyPassword="ngForm" (ngSubmit)="changePassword(ModifyPassword.value)">

    <div class="wrapper">
      <legend class="text-center"> {{id}}تغيير الرقم السري للمستخدم </legend>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container" style="margin-left: 25%">

          <div class="input-data">
            <input type="password" required id="newPassword" name="newPassword" ngModel>
            <div class="underLine"></div>
            <label for="newPassword"> الرقم السري الجديد</label>
          </div>
        </div>

      </div>

      <button type="submit" class="btn  w-25" style="padding:10px;margin-left: 38%;background: var(--bg);color: var(--color)">
        حفظ
      </button>
    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
