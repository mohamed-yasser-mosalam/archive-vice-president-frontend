<div class="page page-narrow">
  <div class="page-header">
    <div>
      <h1 class="page-title">عدد الخطابات حسب السنة</h1>
      <p class="page-subtitle">اختر سنة لعرض عدد الخطابات المسجلة فيها</p>
    </div>
  </div>

  <section class="card-panel">
    <div class="panel-header">
      <div class="panel-title">إحصائيات العام</div>
      <select class="year-select" [(ngModel)]="selectedYear" (change)="getNumberOfLetterForYears()">
        <option [ngValue]="undefined" disabled>اختر السنة</option>
        <option *ngFor="let year of years" [ngValue]="year">{{ year }}</option>
      </select>
    </div>
    <div class="panel-body year-stats" *ngIf="{
        e: +numberOfExportLetterForSpecificYear || 0,
        i: +numberOfImportLetterForSpecificYear || 0,
        s: +numberOfSpecialLetterForSpecificYear || 0
      } as y">
      <div class="year-total">
        <span class="year-total-value">{{ y.e + y.i + y.s }}</span>
        <span class="year-total-label">{{ selectedYear ? 'إجمالي الخطابات لعام ' + selectedYear : 'اختر سنة لعرض إحصائياتها' }}</span>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span>الخطابات الواردة</span><strong>{{ y.i }}</strong></div>
        <div class="bar"><span class="tone-red" [style.width.%]="(y.e + y.i + y.s) ? y.i * 100 / (y.e + y.i + y.s) : 0"></span></div>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span>الخطابات الصادرة</span><strong>{{ y.e }}</strong></div>
        <div class="bar"><span class="tone-green" [style.width.%]="(y.e + y.i + y.s) ? y.e * 100 / (y.e + y.i + y.s) : 0"></span></div>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span>الخطابات الخاصة</span><strong>{{ y.s }}</strong></div>
        <div class="bar"><span class="tone-blue" [style.width.%]="(y.e + y.i + y.s) ? y.s * 100 / (y.e + y.i + y.s) : 0"></span></div>
      </div>
    </div>
  </section>
</div>
