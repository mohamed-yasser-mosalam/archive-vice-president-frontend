<div class="page">
  <div class="detail-layout">
    <div class="detail-main">
      <form class="form-card" [formGroup]="deanDecisions">

        <div class="wrapper">
          <legend class="text-center"> قرارات العميد
          </legend>

          <div class="d-flex">
            <div class="input-data">
              <input type="text" readonly id="num" formControlName="num">
              <div class="underLine"></div>
              <label for="num">  رقم القرار </label>
            </div>

            <div class="input-data">
              <input type="number" readonly id="no" formControlName="no">
              <div class="underLine"></div>
              <label for="no">رقم الملف</label>
            </div>
          </div>
          <div class="d-flex">


            <div class="input-data">
              <input type="text" readonly id="createdBy" formControlName="createdBy">
              <div class="underLine"></div>
              <label for="createdBy">أنشأ بواسطة</label>
            </div>
            <div class="input-data">
              <input type="Date" readonly id="date" formControlName="date">
              <div class="underLine"></div>
              <label for="date">  تاريخ القرار</label>
            </div>
          </div>
          <div class="input-data">
            <input cols="40" rows="1" readonly id="summary" formControlName="summary">
            <div class="underLine"></div>
            <label for="summary">موضوع القرار</label>
          </div>



          <div class="detail-pager">
            <ngb-pagination [(page)]="page" [pageSize]="size" [collectionSize]="pageLength"
                            (pageChange)="change($event)"
                            [maxSize]="1" [boundaryLinks]="true" [ellipses]="false" [rotate]="false">
            </ngb-pagination>

          </div>
        </div>


      </form>
    </div>

    <aside class="detail-media">
      <div class="detail-media-title">المرفقات</div>
      <div class="empty-state no-attachments" *ngIf="!paths || !paths.length">لا توجد مرفقات لهذا السجل</div>
      <ngb-carousel class="w-100">
        <ng-template ngbSlide *ngFor="let item of paths;let i=index">
          <div class="carousel-wrapper" [id]="'print-section-' + i">
            <img src="{{item}}">
          </div>
          <div class="d-flex">

            <button [printSectionId]="'print-section-' + i"   ngxPrint
                    class="btn btn-outline-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-printer" viewBox="0 0 16 16">
                <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1"/>
              </svg>
              طباعة
            </button>
          </div>
        </ng-template>
      </ngb-carousel>
    </aside>
  </div>
</div>
