<app-navbar xmlns="http://www.w3.org/1999/html"></app-navbar>
<div class="row">

  <app-image-slider class="col-4"></app-image-slider>
     <form class="col-6" style="zoom: 60% " [formGroup]="editImport" (ngSubmit)="update()">

    <div class="wrapper">
      <legend class="text-center" style="font-weight: bold">{{x}} تعديل ملف وارد رقم</legend>
      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container ">

          <div class="input-data">
            <input type="text" readonly id="numberOfAttachments" formControlName="numberOfAttachments">
            <label for="numberOfAttachments">عدد المرفقات</label>
          </div>
          <div class="input-data" style="top:50px">
            <input type="text"   id="sender" formControlName="sender">
            <label for="sender">الجهة الوارد منها الخطاب</label>
          </div>
        </div>
        <div class="input-container">
          <div class="d-flex">
            <div class="input-data" style="width: 65%">
              <input type="Date"  id="incomeDate" formControlName="incomeDate">
              <label for="incomeDate">تاريخ الورود</label>
            </div>
            <div class="input-data " style="width:30%; margin-left:auto;">
              <input type="number" readonly id="id" formControlName="id">
              <label for="id">رقم القيد</label>
            </div>
          </div>
          <div class="d-flex">
            <div class="input-data" style="width: 55%">
              <input type="text" id="incomingLetterDate" formControlName="incomingLetterDate">
              <label for="incomingLetterDate">تاريخه</label>
            </div>
            <div class="input-data " style="width:40%; margin-left:auto;">
              <input type="number" id="incomingLetterNumber" formControlName="incomingLetterNumber">
              <label for="incomingLetterNumber">رقم الخطاب الوارد</label>
            </div>
          </div>
        </div>
      </div>
      <div class="input-data" style="bottom:20px">
        <input type="text" style="height: 50px;"  id="summary" formControlName="summary">
        <label for="summary" >ملخص الخطاب</label>
      </div>

      <div style="display: flex;  justify-content: space-between;">
        <div class="input-container position-relative" style="bottom:60px">
          <div class="input-data">
            <input type="text" readonly id="responseSide" formControlName="responseSide">
            <label for="responseSide">الجهة الصادر اليها </label>
          </div>
          <div class="input-data" >
            <input type="Date"   id="recipientDate" formControlName="recipientDate">
            <label for="recipientDate">تاريخ الاستلام</label>
          </div>
          <div class="input-data"style="bottom: 0px; ">
            <button type="submit"  class="btn  w-50"  style="padding:10px; bottom:60px;color: white;background: #333333;margin-left:25%">    حفظ  </button>
          </div>

        </div>
        <div class="input-container position-relative" style="bottom:60px">
          <div style="display: flex;">
            <div class="input-data w-50">
              <input type="Date"  readonly   id="responseDate" formControlName="responseDate">
              <label for="responseDate">تاريخ الرد</label>
            </div>
            <div class="input-data" style="width:35%; margin-left:auto;">
              <input type="text"   readonly  id="responseNumber" formControlName="responseNumber">
              <label for="responseNumber">الرد</label>
            </div>
          </div>
          <div class="input-data" style="bottom: 50px;">
            <input type="text"    id="recipientName" formControlName="recipientName">
            <label for="recipientName" style="margin-top: 40px;">المستلم</label>
          </div>
          <div class="input-data" style="bottom: 55px;">
            <input type="text"    id="num" formControlName="num">
            <label for="num">رقم الملف</label>
          </div>
        </div>
      </div>
    </div>
  </form>
  <div class="col-2 position-relative">
    <app-sidebar></app-sidebar>
  </div>
</div>
